<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小球斗蛐蛐 · 1v1 电子斗蛐蛐</title>
<style>:root{
  --bg:#080b11; --panel:#111823; --panel2:#18202e; --line:#26344a;
  --txt:#e9eff8; --dim:#8b9bb4; --acc:#5ad1ff; --acc2:#ff8a3d;
  --ok:#7cff8a; --bad:#ff5d7a; --gold:#ffe14d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:760px;margin:0 auto;padding:8px 10px 14px}
header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:16px;margin:0;letter-spacing:1px;font-weight:700}
h1 small{display:block;font-size:10px;color:var(--dim);font-weight:400;letter-spacing:0}
.tabs{display:flex;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{background:none;border:0;color:var(--dim);font-size:12px;padding:7px 11px;font-weight:600}
.tabs button.on{background:var(--acc);color:#04121c}
.hud{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
.hud.melee{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:6px;align-items:start;}
.hud.melee .mid{grid-column:1/-1;order:-1;text-align:center}
.hud.melee .side{background:rgba(255,255,255,.05);border-radius:9px;padding:6px 7px;border:1px solid rgba(255,255,255,.07);}
.hud.melee .side.pickable{border-color:#4dd0ff;background:rgba(77,208,255,.10);}
.hud.melee .side.out{opacity:.42;filter:grayscale(.7);}
.hud .side{position:relative;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  transition:transform .08s,border-color .15s,box-shadow .15s,background .15s}
.hud.focusable .side{cursor:pointer}
.hud .side:active{transform:scale(.97);filter:brightness(1.35)}
.hud .side.focus{border-color:#ffd24d;background:rgba(255,210,77,.12);
  box-shadow:0 0 0 2px rgba(255,210,77,.34),0 0 14px rgba(255,210,77,.22)}
.hud .side.focus .nm span{color:#fff3c4}
.hud .side.l.focus,.hud .side.r.focus{border-color:#ffd24d}
.hud .side.focus::after{content:'· 追踪中';display:block;margin-top:2px;font-size:8.5px;
  font-weight:800;color:#ffd24d;letter-spacing:.5px}
.hud.melee .side .nm{font-size:11px;}
.hud.melee .side .mt{font-size:9.5px;line-height:1.35;}
.hud.melee .mtr{margin-top:1px}
.hud.melee .side .mtr .sw{font-size:9.5px;padding:1px 5px;border-radius:5px;
  border:1px solid var(--line);color:var(--dim);font-weight:800}
.hud.melee .side.pickable .mtr .sw{color:#4dd0ff;border-color:#4dd0ff}
.hud.melee .side .rk{display:inline-block;font-size:9px;font-weight:800;padding:0 4px;border-radius:4px;background:#ffd24d;color:#1a1204;margin-right:3px;}
.side{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
.side.r{text-align:right}
.side .nm{display:flex;align-items:center;font-size:12px;font-weight:700;min-width:0;gap:0}
.side .nm i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;flex:0 0 auto}
.side .nm .rk{flex:0 0 auto}
.side .nm span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .nm .sw{flex:0 0 auto;margin-left:4px}
.side .mtr{display:flex;align-items:center;gap:5px;min-width:0}
.side .mtr .mt{flex:1 1 auto;min-width:0}
.side .mtr .sw{flex:0 0 auto}
.bar{height:9px;background:#0b1119;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;width:100%;transition:width .08s linear;border-radius:5px}
.side .mt{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px}
.mid .t{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mid .s{font-size:9px;color:var(--dim)}
.stage{position:relative;background:#05080d;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage.fsopen{position:fixed;left:0;top:0;right:0;bottom:0;width:100vw;height:100vh;z-index:60;
  border:0;border-radius:0;display:flex;align-items:center;justify-content:center;background:#05080d}
.stage.fsopen canvas{width:100%;height:100%;object-fit:contain;
  transform:translate(var(--fspx,0px),var(--fspy,0px)) scale(var(--fsz,1));
  transform-origin:center center;touch-action:none;cursor:grab;will-change:transform}
.stage.fsopen canvas.fsdrag{cursor:grabbing}
.fszoom{display:flex;align-items:center;gap:4px}
.fszoom .fb{padding:6px 8px;min-width:30px}
.fszoom .fzt{font-size:11px;font-weight:800;color:var(--txt);min-width:40px;text-align:center;
  font-variant-numeric:tabular-nums}
.stage.fsopen .over{z-index:66}
.stage.fsopen .hud{position:absolute;left:0;right:0;bottom:0;z-index:64;margin:0;
  padding:8px 8px calc(16px + env(safe-area-inset-bottom));align-items:flex-end;
  background:linear-gradient(transparent,rgba(5,8,13,.92) 42%);border:0;border-radius:0}
.stage.fsopen .hud.melee{display:flex;flex-wrap:wrap;gap:5px}
.stage.fsopen .hud.melee .mid{order:0;flex:0 0 auto}
.stage.fsopen .hud.melee .side{flex:1 1 30%;min-height:44px}
.stage.fsopen .hud .side{min-height:48px;padding:8px 9px}
.stage.fsopen .hud .sw{display:none}
.fsbar{position:absolute;left:8px;top:8px;z-index:65;display:none;align-items:center;gap:5px;
  padding:4px;border-radius:10px;background:rgba(10,16,26,.78);border:1px solid var(--line);
  max-width:calc(100% - 52px);flex-wrap:wrap}
.stage.fsopen .fsbar{display:flex}
.fsbar .fb{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
  padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.fsbar .fb.pri{background:var(--acc);color:#04121c;border-color:var(--acc)}
.fsbar .fb:active{transform:scale(.95)}
.fsbar .fsp{background:none;border:0;color:var(--dim);font-size:11px;font-weight:700;
  padding:5px 7px;border-radius:7px}
.fsbar .fsp.on{background:var(--gold);color:#1a1500}
.stage.fsopen .fsbar{left:calc(8px + env(safe-area-inset-left))}
.fsbtn{position:absolute;right:6px;top:6px;z-index:68;width:30px;height:30px;border-radius:8px;
  background:rgba(10,16,26,.72);border:1px solid var(--line);color:var(--txt);
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
  padding:0;opacity:.82}
.fsbtn:active{transform:scale(.94);opacity:1}
.stage.fsopen .fsbtn{right:calc(6px + env(safe-area-inset-right));top:8px}
.stage.fsopen .fsbar{transition:opacity .15s}
.fsbar.hide{opacity:0;pointer-events:none}
canvas{display:block;width:100%;height:auto}
.over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,8,13,.82);backdrop-filter:blur(2px);z-index:3}
.over.show{display:flex}
.over .ttl{font-size:22px;font-weight:800;margin-bottom:4px}
.over .sub{font-size:11px;color:var(--dim);margin-bottom:12px}
.over button{background:var(--acc);color:#04121c;border:0;border-radius:9px;padding:9px 20px;font-size:13px;font-weight:700}
.ctrl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:9px 4px;font-size:12px;font-weight:600;text-align:center}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#04121c;border-color:var(--acc)}
.btn.on{background:var(--acc2);color:#160800;border-color:var(--acc2)}
.spd{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.spd button{background:none;border:0;color:var(--dim);font-size:11px;font-weight:700;padding:5px 8px;border-radius:7px}
.spd button.on{background:var(--gold);color:#1a1500}
.topbar{margin-bottom:6px}
.maprow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:5px 7px;margin-bottom:5px}
.maprow .mlb{font-size:10px;color:var(--dim);font-weight:700;flex:0 0 auto}
.maprow .mtip{font-size:10px;color:var(--dim);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--acc);color:#04121c;border-color:var(--acc)}
.chip.on i{box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 7px;margin-bottom:5px}
.pick-hd{display:flex;align-items:center;margin-bottom:5px}
.pick-hd span{font-size:11px;font-weight:700;color:var(--acc)}
.pick-hd button{margin-left:auto;background:none;border:0;color:var(--dim);font-size:10px;padding:2px 4px}
.pick-row{display:flex;flex-wrap:wrap;gap:5px}
.pick-desc{font-size:10px;color:var(--dim);margin-top:5px;line-height:1.4}
.pick-cats{padding:4px 0 5px;margin-bottom:2px;border-bottom:1px dashed var(--line);
  position:sticky;top:0;z-index:3;background:var(--panel)}
.pick-cats .ccat{background:var(--panel2);font-size:10.5px;padding:4px 9px}
.pick-cats .ccat.on{background:var(--acc);color:#04121c;border-color:var(--acc)}
.pick-tip{font-size:9.5px;color:var(--dim);margin:0 0 5px;line-height:1.4;opacity:.85}
.pick-cat{font-size:10px;font-weight:700;color:var(--acc);margin:6px 0 4px;opacity:.9}
.pick-cat:first-of-type{margin-top:2px}
.pick-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick-desc.full{-webkit-line-clamp:99}
.pickpop{display:none;position:fixed;inset:0;z-index:80;align-items:flex-end;justify-content:center;
  background:rgba(3,6,11,.55);padding:0}
.pickpop.on{display:flex}
.pickpop .pick{width:min(560px,100%);max-height:52dvh;overflow:auto;margin:0;
  background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 0 0;
  padding:10px 11px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(0,0,0,.55)}
.pickpop .pick-hd span{font-size:12px}
.pickpop .pick-row .chip{font-size:12px;padding:7px 9px}
.fspick{display:none;position:absolute;inset:0;z-index:70;align-items:center;justify-content:center;
  background:rgba(3,6,11,.58);padding:12px}
.fspick .pick{width:min(560px,100%);max-height:72vh;overflow:auto;margin:0;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
.fspick .pick-hd span{font-size:12px}
.fspick .pick-row button{font-size:12px;padding:7px 9px}
.side .nm .sw{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);
  border-radius:5px;padding:0 4px;margin-left:4px;flex:0 0 auto}
.side.pickable .nm{background:rgba(90,209,255,.08);border-radius:6px;margin:-2px -4px;padding:2px 4px}
.side.pickable .nm .sw{color:var(--acc);border-color:var(--acc)}
.tip{font-size:10px;color:var(--dim);margin-top:8px;line-height:1.6}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
#mask.show{display:block}
#set{position:fixed;left:0;right:0;bottom:0;height:86vh;background:var(--panel);z-index:21;
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);
  transition:transform .25s ease;display:flex;flex-direction:column}
#set.show{transform:translateY(0)}
#set .hd{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
#set .hd b{font-size:14px}
#set .hd .x{margin-left:auto;background:none;border:0;color:var(--dim);font-size:20px;line-height:1;padding:0 4px}
#setBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 24px}
.sec{margin-bottom:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.sec-t{font-size:12px;font-weight:700;color:var(--acc);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-t .tag{font-size:9px;color:var(--dim);font-weight:400}
.fld{margin-bottom:16px;padding:1px 0}
.fld .lb{display:flex;align-items:center;font-size:11px;color:var(--dim);margin-bottom:5px;min-height:20px}
.fld .lb span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.fld .lb input{width:66px;flex:0 0 auto;background:#0b1119;border:1px solid var(--line);color:var(--txt);
  border-radius:7px;font-size:12px;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
.fld .rw{display:flex;gap:8px;align-items:center}
.sl{position:relative;flex:1;min-width:0;height:38px;display:flex;align-items:center;
  touch-action:pan-y;-webkit-user-select:none;user-select:none}
.sl .trk{position:absolute;left:0;right:0;top:50%;height:7px;margin-top:-3.5px;border-radius:4px;
  background:#0b1119;border:1px solid var(--line);pointer-events:none}
.sl .fil{position:absolute;left:0;top:50%;height:7px;margin-top:-3.5px;border-radius:4px;
  background:var(--acc);opacity:.5;pointer-events:none}
.sl .thb{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  background:var(--acc);border:2px solid #071119;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.sl.hot .thb{transform:scale(1.14);box-shadow:0 0 0 5px rgba(90,209,255,.18)}
.sl .val{position:absolute;top:50%;padding:2px 6px;border-radius:6px;background:rgba(8,14,22,.92);
  border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--txt);
  transform:translate(-50%,-160%);pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.stp{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt);font-size:16px;font-weight:700;line-height:1}
.stp:active{background:var(--acc);color:#04121c}
input[type=range]{display:none}
select{width:100%;background:#0b1119;border:1px solid var(--line);color:var(--txt);border-radius:8px;
  padding:8px;font-size:12px;margin-bottom:8px}
.desc{font-size:10px;color:var(--dim);line-height:1.5;margin:-2px 0 8px;padding-left:2px}
#set .ft{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#hud .slots{display:flex;gap:4px;margin-top:5px;justify-content:center;width:100%}
#hud .slots b{flex:1 1 0;min-width:0;font-size:10px;font-weight:700;line-height:1.25;padding:3px 2px;border-radius:6px;
  border:1px solid rgba(90,209,255,.35);background:rgba(90,209,255,.07);color:#9fe4ff;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
#hud .slots b.on{border-color:#ffd24d;color:#ffd24d;background:rgba(255,210,77,.15)}
#hud .slots b.gone{opacity:.34;text-decoration:line-through;cursor:not-allowed;border-color:rgba(255,93,122,.35);color:#ff9db0}
#hud .syn{margin-top:4px;font-size:10px;color:#ffd88a;line-height:1.35;text-align:center;width:100%}
.hud.duel{display:flex;flex-direction:column;align-items:stretch;gap:5px}
.hud.duel .mid{order:-1;text-align:center}
.hud.duel .side{width:100%;flex:0 0 auto}
.hud.duel .side.r{text-align:left}
.hud.duel .side.r .nm{flex-direction:row-reverse;justify-content:flex-start}
.hud.duel .slots{flex-wrap:wrap;justify-content:flex-start}
.hud.duel .slots b{flex:1 1 30%;min-width:70px}
.hud.duel .syn{text-align:left}
.stage.fsopen .hud.duel{display:flex;flex-direction:row;align-items:flex-end;gap:6px}
.stage.fsopen .hud.duel .mid{order:0;flex:0 0 auto;text-align:center}
.stage.fsopen .hud.duel .side{flex:1 1 0;width:auto;min-width:0;min-height:0;padding:5px 6px}
.stage.fsopen .hud.duel .side.r{text-align:right}
.stage.fsopen .hud.duel .side.r .nm{flex-direction:row;justify-content:flex-end}
.stage.fsopen .hud.duel .slots{flex-wrap:nowrap;gap:3px;margin-top:3px}
.stage.fsopen .hud.duel .slots b{flex:1 1 0;min-width:0;font-size:9px;padding:2px 1px}
.stage.fsopen .hud.duel .syn{margin-top:2px;font-size:9px;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage.fsopen .hud.duel .mt{font-size:9px;line-height:1.2}
.stage.fsopen.hudhide .hud{display:none}
#fsHud.on{background:var(--gold);color:#1a1500;border-color:var(--gold)}
.stage.fsopen .hud .side{padding:4px 5px;min-height:0;border-radius:8px;
  background:rgba(8,13,20,.66);border:1px solid rgba(255,255,255,.08)}
.stage.fsopen .hud .side .nm{font-size:0;gap:0;margin:0;padding:0;background:none!important}
.stage.fsopen .hud .side .nm span,
.stage.fsopen .hud .side .nm .sw,
.stage.fsopen .hud .side .nm .rk,
.stage.fsopen .hud .side .mt,
.stage.fsopen .hud .mtr,
.stage.fsopen .hud .syn,
.stage.fsopen .hud .mid,
.stage.fsopen .hud .side.focus::after{display:none!important}
.stage.fsopen .hud .side .nm i{width:7px;height:7px;margin:0 0 2px}
.stage.fsopen .hud .bar{height:7px;margin:0;border-radius:5px}
.stage.fsopen .hud.melee{flex-wrap:nowrap;gap:4px}
.stage.fsopen .hud.melee .side{flex:1 1 0;min-width:0}
.stage.fsopen .hud.duel .slots{gap:3px;margin-top:3px}
.stage.fsopen .hud.duel .slots .chip{flex:1 1 0;min-width:0;padding:2px;gap:0}
.stage.fsopen .hud.duel .slots .chip span,
.stage.fsopen .hud.duel .slots .chip b{display:none!important}
.stage.fsopen .hud.duel .slots .chip i{width:100%;min-width:0;height:6px;border-radius:3px;margin:0}
.stage.fsopen .hud.duel .slots .chip.gone{opacity:.28}
.ro-mask{position:fixed;inset:0;z-index:120;background:rgba(4,7,12,.78);
  display:none;align-items:center;justify-content:center;padding:14px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ro-mask.on{display:flex}
.ro-box{width:min(94vw,420px);max-height:92dvh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:12px 13px 14px;
  box-shadow:0 16px 40px rgba(0,0,0,.6);-webkit-overflow-scrolling:touch}
.ro-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ro-title{font-size:13px;font-weight:700;letter-spacing:1px}
.ro-sub{font-size:10px;color:var(--dim);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ro-x{font-size:15px;color:var(--dim);padding:2px 4px;line-height:1;flex:none}
.ro-x:active{color:var(--txt)}
.ro-prog{display:flex;gap:4px;margin-bottom:8px}
.ro-pg{flex:1;height:3px;border-radius:2px;background:var(--line)}
.ro-pg.now{background:var(--acc)}
.ro-pg.done{background:var(--acc);opacity:.45}
.ro-wrap{position:relative;width:min(78vw,300px);aspect-ratio:1/1;margin:0 auto}
#roCv{width:100%;height:100%;border-radius:50%;display:block}
.ro-pin{position:absolute;left:50%;top:-4px;transform:translateX(-50%);z-index:3;
  width:12px;height:15px}
.ro-pin::before{content:"";position:absolute;inset:0;background:var(--acc);
  clip-path:polygon(50% 100%,0 0,100% 0);
  filter:drop-shadow(0 0 4px rgba(90,209,255,.75))}
.ro-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:11px;height:11px;border-radius:50%;background:var(--panel);
  box-shadow:0 0 0 1px var(--acc);z-index:2}
.ro-hub::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:3px;height:3px;border-radius:50%;background:var(--acc);opacity:.8}
.ro-res{min-height:52px;margin:9px 0 8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;text-align:center}
.ro-live{font-size:11px;color:var(--dim);letter-spacing:1px;min-height:15px}
.ro-name{font-size:17px;font-weight:700;letter-spacing:1px;display:none}
.ro-name.on{display:block}
.ro-desc{font-size:10px;color:var(--dim);line-height:1.5;max-width:100%;
  display:none;padding:0 4px}
.ro-desc.on{display:block}
.ro-turns{font-size:10px;color:var(--dim);letter-spacing:1px;display:none;
  font-variant-numeric:tabular-nums}
.ro-turns.on{display:block}
.ro-pw{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ro-pw .lb{font-size:10px;color:var(--dim);letter-spacing:1px;flex:none}
.ro-pw input[type=range]{flex:1;min-width:0;appearance:none;-webkit-appearance:none;
  height:3px;border-radius:2px;background:var(--line);outline:none;margin:0}
.ro-pw input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;
  width:16px;height:16px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 1px var(--panel),0 0 6px rgba(90,209,255,.6);cursor:pointer}
.ro-pw input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;
  background:var(--acc);box-shadow:0 0 0 1px var(--panel);cursor:pointer}
.ro-pw .v{font-size:10px;color:var(--txt);font-variant-numeric:tabular-nums;
  width:30px;text-align:right;flex:none}
.ro-big{width:100%;height:42px;border-radius:10px;font-size:14px;font-weight:600;
  letter-spacing:4px;color:#04121c;background:var(--acc)}
.ro-big:active{opacity:.82}
.ro-big[disabled]{opacity:.4;pointer-events:none}
.ro-big.ok{background:var(--ok)}
.ro-row{display:flex;gap:6px;margin-top:7px}
.ro-btn{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);font-size:11px;letter-spacing:1px}
.ro-btn:active{background:var(--line)}
.ro-btn.warn{color:var(--bad);border-color:rgba(255,93,122,.4)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>小球斗蛐蛐</h1>
    <div class="tabs">
      <button id="tabArena" class="on">方框内战斗</button>
      <button id="tabBreak">撞击战斗</button>
      <button id="tabDuel">决斗</button>
      <button id="tabMelee">混战</button>
      <button id="tabTrain">训练场</button>
    </div>
  </header>

  <div class="hud" id="hud">
    <div class="side l" id="hudL">
      <div class="nm"><i></i><span>—</span><b class="sw">换球</b></div>
      <div class="bar"><i style="width:100%"></i></div>
      <div class="mt">—</div>
    </div>
    <div class="mid"><div class="t" id="midT">0.0s</div><div class="s" id="midS">待开始</div></div>
    <div class="side r" id="hudR">
      <div class="nm"><b class="sw">换球</b><span>—</span><i></i></div>
      <div class="bar"><i style="width:100%"></i></div>
      <div class="mt">—</div>
    </div>
  </div>

  <div class="topbar" id="topbar"></div>

  <div class="pickpop" id="pickPop"></div>

  <div class="stage" id="stageEl">
    <canvas id="cv"></canvas>
    <button class="fsbtn" id="fsBtn" title="全屏">⛶</button>
    <div class="fsbar" id="fsBar">
      <button class="fb pri" id="fsPlay">▶ 开始</button>
      <button class="fb" id="fsReset">重置</button>
      <button class="fb" id="fsHud">信息</button>
      <button class="fb" id="fsSw" title="换球">⇌ 换球</button>
      <button class="fsp" data-s="0.5">0.5x</button>
      <button class="fsp on" data-s="1">1x</button>
      <button class="fsp" data-s="2">2x</button>
      <button class="fsp" data-s="4">4x</button>
      <div class="fszoom">
        <button class="fb" id="fsZoomOut" title="缩小">−</button>
        <span class="fzt" id="fsZoomTxt">100%</span>
        <button class="fb" id="fsZoomIn" title="放大">＋</button>
        <button class="fb" id="fsZoomReset" title="取消缩放，恢复默认">恢复默认</button>
      </div>
    </div>
    <div class="fspick" id="fsPick"></div>
    <div class="over" id="over">
      <div class="ttl" id="ovT">—</div>
      <div class="sub" id="ovS">—</div>
      <button id="ovB">下一局</button>
    </div>
  </div>

  <div class="ctrl">
    <div class="spd" id="spd">
      <button data-s="0.5">0.5x</button>
      <button data-s="1" class="on">1x</button>
      <button data-s="2">2x</button>
      <button data-s="4">4x</button>
    </div>
    <div class="btn pri" id="btnPlay">开始</div>
    <div class="btn" id="btnReset">重置</div>
    <div class="btn" id="btnSet">设置</div>
  </div>
</div>

<div id="mask"></div>
<div id="set">
  <div class="hd"><b>设置</b><button class="x" id="setX">✕</button></div>
  <div id="setBody"></div>
  <div class="ft">
    <div class="btn" id="btnDefault">恢复默认</div>
    <div class="btn pri" id="btnClose">完成</div>
  </div>
</div>

  ulsans:{name:'Unjustice last breath',cat:'odd',color:'#cfe6ff',skill:'sans',desc:'Last breath 的全面强化版：Last breath 会的一切它都会，且基础数值更强◆【没有一阶段尾杀，也不走子弹列车 / 弹幕疾行 / 骨海那条复杂链——形态只有：基础 → Phase 2 → 死亡站点】◆弹幕：数量更多、更密，但单发伤害更低；出膛初速很低，一旦脱离自身范围便开始加速◆审判眼：特效更强、颜色越发泛白◆Phase 2（LV 加持，血量更厚因而没被击杀）：双手持蓝色骨棒，远程与近战兼具◆特殊形态「死亡站点」（对标弹幕疾行）：受伤时有概率开启——完全复制对手球的所有技能与数值（血量除外），期间进入虚化（无法被扣血），并缓慢回血直到血满后解除；自身血量越低，死亡站点越强；开启与回血都需要消耗蓝条，蓝条恢复很慢，蓝条不足则无法开启',
    base:{hp:385,atk:23,atkSpeed:1.26,moveSpeed:212,crit:0.16,critDmg:1.8,dodge:0.11,lifesteal:0,armor:0.07,radius:14}},
  quark:{name:'夸克星',cat:'odd',color:'#6cf0ff',skill:'quark',desc:'色禁锢：命中叠加「夸克解离」标记（最多5层），逐层拆解攻击力/移速/护盾效率｜渐近自由：贴脸伤害 ×1.15、远距离仅 ×0.48｜简并压力：血量越低减伤越高，丝血约 27%｜狂暴·退禁闭：命中禁用对方技能数秒，每次攻击随机一种味（上味增伤/下味减速/奇味护盾/粲味追击）',
    base:{hp:240,atk:14,atkSpeed:1.5,moveSpeed:190,crit:0.14,critDmg:1.7,dodge:0.08,lifesteal:0,armor:0.05,radius:14}},
  uranium:{name:'铀-235球',cat:'bullet',color:'#9dff5c',skill:'uranium',desc:'亚临界：命中概率触发中子轰击留下裂变标记，标记期间再受击引发连锁裂变并弹射中子（一传二）｜狂暴·超临界：累计裂变达标后进入，攻击自带裂变、弹射翻倍、辐射场持续灼烧、标记互相传染｜熔毁：超临界过久过热爆炸，重创全场并重伤自己（残而不死）',
    base:{hp:318,atk:25,atkSpeed:1.35,moveSpeed:185,crit:0.15,critDmg:1.7,dodge:0.08,lifesteal:0,armor:0.15,radius:14}},
  refract:{name:'折射',cat:'bullet',color:'#ffd24d',skill:'refract',desc:'紫外线：小额削减对方血量上限并附加灼烧｜红外线：主要造成灼烧伤害｜太阳光谱：高伤长冷却，施法时必须定在原地，七彩汇聚成极亮光线持续照射，撞壁反射最多 7 次、遍布整块空间，逐次减弱（越弱越黯淡）｜狂暴：外化为太阳并持续释放紫外线，随后膨胀为红巨星（移速变慢、伤害大增），若对手未淘汰则最终触发超新星全图爆发',
    base:{hp:296,atk:20,atkSpeed:1.25,moveSpeed:192,crit:0.13,critDmg:1.9,dodge:0.12,lifesteal:0,armor:0.10,radius:14}},
  gravity:{name:'万有引力',cat:'odd',color:'#7ea8ff',skill:'gravity',desc:'重力立场：迫使敌球上升，到顶点后重力加速度衰落造成摔落伤害｜引力轨道：概率开启并带冷却，捕获敌方弹幕转化为星环；携环贴脸时敌球被自己的弹幕反噬；可捕获冲撞球/居合球等特殊体，被捕获者绕其旋转、无法攻击，撞壁受伤，一段时间后自主挣脱；时限到则弹幕散射反击且不伤自己｜狂暴：坍缩黑洞·极强引力（不是类星体）',
    base:{hp:300,atk:21,atkSpeed:1.35,moveSpeed:188,crit:0.14,critDmg:1.8,dodge:0.11,lifesteal:0,armor:0.11,radius:14}},
  detector:{name:'侦测球',cat:'bullet',color:'#4affd0',skill:'sonar',desc:'发射声波探测，撞壁产生回响可二次探测（小场回响更多，每次撞壁还会被动再探一次）；探测到敌人则下一发子弹必暴击（伤害=基础×1.5）；多次探测暴露对方情报（可蓄力/可回血等），发现蓄力则改发追踪弹；预判到的弹幕有概率被打空；已探测到冲撞球时可预判其冲刺走向｜狂暴：潜水声呐全开·持续探测、近乎完全躲开弹幕、主动远离黑洞引力范围',
    base:{hp:290,atk:22,atkSpeed:1.55,moveSpeed:196,crit:0.14,critDmg:1.9,dodge:0.16,lifesteal:0,armor:0.09,radius:13}},
  glitch:{name:'错误球',cat:'math',cat:'odd',color:'#ff3b6b',skill:'glitch',desc:'伤害数字随机；移动会瞬移/静止/旋转/重力/浮力；接触+远程双攻击，命中减速；子弹命中有中低概率触发定身｜【血量错误】自身血量数字会在 0 与其他数字之间不停波动（只影响显示）；血量归零不会立即失败——可继续受伤并把血量扣成负数，负数持续一段时间后「血量消失」，随后重新抽取一个 250 以上的血量继续战斗（默认 2 次）；若抽到的血量低于 100，本次免单，血量掉光时可再抽一次｜狂暴：瞬移暴涨且贴脸闪现、减速强化到 90%、血量√·³√·²·³·! 运算、受击触发负数、伤害指数增长，并有低概率进入绿色形态（伤害按斐波那契数列 1,1,2,3,5,8,13,21… 递增）',
    base:{hp:262,atk:15,atkSpeed:1.25,moveSpeed:195,crit:0.12,critDmg:1.6,dodge:0.08,lifesteal:0,armor:0.08,radius:14}},
  nuke:{name:'核弹',cat:'odd',color:'#ff8c1a',skill:'nuke',desc:'没有任何主动攻击手段：不发射弹幕、不近战、撞击也不造成伤害，只会不停移动｜唯一技能：起爆 —— 一段极其漫长的前摇（默认 30 秒），期间只做充能与警示；前摇归零的瞬间立即自爆，摧毁整个战斗框，将场上所有球（含自己）一并淘汰｜前摇最后 6 秒进入预警：滴答声变急促、屏幕微颤、红色警示扩张、头顶显示倒计时｜不进入狂暴（没有狂暴形态）',
    base:{hp:660,atk:0,atkSpeed:1.0,moveSpeed:150,crit:0,critDmg:1.0,dodge:0,lifesteal:0,armor:0.05,radius:16}},
  split:{name:'分裂球',cat:'odd',color:'#9ccb3b',skill:'split',desc:'发射弹幕｜主动：分裂出子球，子球战力为本体的 3/5，同样发射弹幕且可继续分裂（最多 4 代）；普通分裂子球只是分身，本体阵亡即判负｜细胞分裂：概率额外分裂出一个数值基本一致的子球｜转移灶：血量偏低时概率在原处外生出一颗「转移灶」（分叶状肿瘤结节，外覆新生血管、内有坏死核心），本体坏死后只有转移灶能接管继续战斗并争取胜利｜狂暴·肿瘤细胞：分裂速度大幅加快，子球战力降为 1/3；同时开放子球再分裂（独立名额），二代子球在 1/3 基础上继续衰减，越分越弱（靠数量取胜）｜子球离母球越近，自身分裂越快（贴着母球时冷却与前摇同步缩短）',
    base:{hp:250,atk:17,atkSpeed:1.35,moveSpeed:190,crit:0.15,critDmg:1.7,dodge:0.10,lifesteal:0,armor:0.06,radius:14}},
  murphy:{name:'墨菲定律球',cat:'bullet',color:'#ff9f1c',skill:'murphy',desc:'发射弹幕｜隔膜：小概率生成单向通道，己方弹幕可穿出，敌方球/弹幕无法进入（冲撞球·居合球撞上去不受伤反被弹开），期间球体出现轻微色散锐化可资分辨｜打断：检测到敌方蓄力/回血/进入状态时概率触发水平错乱样式，打断该状态；错乱未恢复前敌方无法重复尝试｜意外：敌方撞壁有小概率倒霉扣血，敌方弹幕被弹回命中自己时也会意外扣血｜狂暴·Wonder of you：倒霉概率大增，隔膜长效生效',
    base:{hp:308,atk:26,atkSpeed:1.35,moveSpeed:186,crit:0.14,critDmg:1.7,dodge:0.11,lifesteal:0,armor:0.11,radius:14}},
  killer:{name:'Killer.',cat:'ram',color:'#ff2f4f',skill:'killer',desc:'红色匕首近战 / 投掷匕首 / 投掷骨棒 / 冲刺斩击｜远程斩击：不需近身，在敌人所在处自上而下连斩数刀（红色竖线直接超出框）｜主动技能：连续远程斩击、小型瞬移（与 Last breath 同理）、超巨型加斯特冲击波（每局仅限一次）｜状态：靶心（基本形态）／灾难（虚弱：移速上升但伤害与攻击频率下降，概率极低且单局仅一次，会自动切回）｜狂暴·杀手时刻：移速、伤害、攻击频率大幅上升，连续远程斩击使用率大增，并有中概率使用「远程斩击旋转」——以固定中心点连续斩击并顺时针或逆时针旋转，中途还会反向｜血量清零后进入 Phase 2·死亡交响曲：左手一把红匕首 + 右手四把匕首在指尖旋转，弹幕量、攻击频率与攻击范围再增',
    base:{hp:278,atk:20,atkSpeed:1.20,moveSpeed:200,crit:0.16,critDmg:1.7,dodge:0.10,lifesteal:0.04,armor:0.08,radius:14}},
  betrayer:{name:'Betrayer背叛者',cat:'bullet',color:'#ff6bd6',skill:'betrayer',desc:'Phase 1：发射骨棒 + 加斯特冲击波 + 骨丛（必须依附墙壁生成——白骨接触即伤、蓝骨接触后移动才割伤）｜审判眼：可使用重力控制，期间攻击更加频繁迅猛｜Phase 2（血量首次跌至 25% → 休息段 I，血量瞬间回复并召来骨棒）：手持骨棒近战并可格挡攻击，同时仍发射骨棒｜Phase 3（血量第二次清零 → 休息段 II，血量回复）：身边召唤蓝色与黄色加斯特冲击波，二者均可冲撞与格挡，也可发射',
    base:{hp:278,atk:21,atkSpeed:1.15,moveSpeed:195,crit:0.15,critDmg:1.7,dodge:0.10,lifesteal:0,armor:0.10,radius:14}},
  grave:{name:'归冢者',cat:'ram',color:'#ffb44d',skill:'grave',desc:'双手凝聚金黄火焰的近战球（拳击非撞击）：拳击 / 连续拳击｜技能①双拳合臂发射金色火球（冲击+灼烧+负面）②背后金色矩形·近战攻速大增且命中附加负面③背后金黄火焰·向前冲刺冲撞（冲击+击飞+灼烧）④扣除 20% 最大生命换取永久数值提升，并解锁双手骨刺⑤蓄力冲拳·高额伤害并击飞｜加斯特冲击波：圆 + 无限长光束｜狂暴·Phase 2：再扣一次 20% 原满血，再叠一层永久强化，攻击增加骨棒弹幕',
    base:{hp:300,atk:25,atkSpeed:1.32,moveSpeed:214,crit:0.16,critDmg:1.8,dodge:0.08,lifesteal:0,armor:0.10,radius:15}},
  dummy:{name:'普通球',cat:'train',color:'#8aa0b4',skill:'dummy',desc:'训练靶球：没有任何攻击手段，也不会造成任何伤害（撞击、反伤一律为 0）；血量极高，用于测试新球的输出与机制。可在竞技场中正常选用。',
    base:{hp:15000,atk:0,atkSpeed:1.0,moveSpeed:170,crit:0,critDmg:1.0,dodge:0,lifesteal:0,armor:0,radius:16}},
  karmic:{name:'业力',cat:'bullet',color:'#8e5cff',skill:'karmic',desc:'非狂暴：仅发射弹幕，概率感应「KR 暗示」获得增益，并有一局一次的 KR 形态（敌方吃负面、我方弹幕强化）｜狂暴：获得 KR 护甲(血量×1.25)＋1 次致命伤抵御，锁链有概率招架攻击；幻想死神改为瞬移追杀且范围伤害大增，出场即给目标负面；锁链四式：A 掷链(远程·本体再刷新链)、B 右手牛仔甩链、C 双手缠臂肉搏(抵御大增)、D 天降红线锁链(多条·无碰撞但接触受伤·可被侦测球探测)',
    base:{hp:282,atk:17,atkSpeed:1.2,moveSpeed:185,crit:0.14,critDmg:1.7,dodge:0.10,lifesteal:0,armor:0.12,radius:14}},
  nebula:{name:'暗星云',cat:'odd',color:'#7b5cc9',skill:'nebula',desc:'放置型：主动技能一「宇宙幕布」在场地释放暗星云，遮挡地图描边，进入者被冻结减速且暂时丢失目标（恢复很快）｜主动技能二「聚合孕育」：将两片星云聚合成大型星云，内部孕育恒星并持续发射弹幕｜主动技能三「超新星链」：大型星云内恒星世代成长与崩解，连续多次小型超新星爆发，沿途造成伤害｜被动四「压缩星云」：星云受内部恒星引力压缩，内部者移动受限并持续扣血｜狂暴·认知的暗夜：频繁生成大型暗星云，召唤多种恒星辅助（可撞击／可发射弹幕），本体进入「绝对黑暗」——整体偏透明，侦测球有概率侦测失败、普通球有概率丢失目标',
    base:{hp:262,atk:17,atkSpeed:1.10,moveSpeed:178,crit:0.12,critDmg:1.7,dodge:0.10,lifesteal:0,armor:0.10,radius:15}},
  binary:{name:'双星系统',cat:'odd',color:'#ffd24d',skill:'binary',desc:'主序星（大）＋伴星（小），两条血量独立计算，系统血量为两者平均｜攻击：双方都发射弹幕，撞击也带伤害；伴星始终围绕主星公转｜演化：系统血量 50% 时抽取演化路径（X射线双星／同等质量双星／一方毁灭形成星环／极特殊路径——需双方血量均低）；X射线路径在 25% 时抽取子路径（中子星或黑洞 × 主星或伴星）｜一方血量清零：该星进入白矮星形态继续战斗，再清零则熔毁为残骸，由另一方携带同行——攻击力下降、受到的伤害大幅降低；残骸积累敌方伤害，条满后演化为提前选定的最终形态并播放对应动画（吸积／共生／星环／旋进-并合-铃宕）｜最终形态没有狂暴，血量清空即失败（中子星会发射脉冲光束）',

  katana:{name:'武士刀',cat:'ram',color:'#ffe9d6',skill:'katana',desc:'对重甲目标伤害低、对无甲目标伤害高（护甲越高越钝）｜近身连续斩击，斩击间隙适中｜敌人较远时进入蓄力（刀刃归鞘），归鞘达到一定程度后拔刀出鞘：瞬间向前移动，并必定命中一次高伤害斩击｜狂暴·呼吸法：血量跌破预选线时提前锁定一种呼吸，全程不再更换——水／炎／雷／风／月／火之神神乐／霞；每种呼吸自带剑技：水车／上升炎天／霹雳一闪·六连／霹雳一闪·神速／岚／残月／圆舞一闪／平流斩',

  var AC=window.AudioContext||window.webkitAudioContext;

  try{

  }catch(e){SND.bad=true;SND.ctx=null;}
  return SND.ctx;

function sndLoop(key,f0,f1,dur,type,vol,lfo,lfoHz){

    var t0=c.currentTime;

    if(f1!=null&&f1!==f0)o.frequency.linearRampToValueAtTime(Math.max(20,f1),t0+dur);
    var g=c.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(Math.max(0.0002,vol),t0+Math.min(0.10,dur*0.35));
    g.gain.setValueAtTime(Math.max(0.0002,vol),t0+dur*0.75);
    g.gain.linearRampToValueAtTime(0.0001,t0+dur);
    var node=g;
    if(lfo){
      var l=c.createOscillator();l.type='sine';l.frequency.value=lfoHz||18;
      var lg=c.createGain();lg.gain.value=lfo;
      l.connect(lg);lg.connect(g.gain);

      SND_LOOP[key+'__l']=l;
    }
    o.connect(g);g.connect(SND.master);
    o.start(t0);o.stop(t0+dur+0.05);
    SND_LOOP[key]={o:o,g:g};
    var tm=setTimeout(function(){if(SND_LOOP[key]&&SND_LOOP[key].o===o)delete SND_LOOP[key];},(dur+0.2)*1000);

function predictAim(sx,sy,tx,ty,tvx,tvy,sp){
  var t=Math.hypot(tx-sx,ty-sy)/Math.max(1,sp);
  for(var i=0;i<3;i++){
    var px=tx+tvx*t,py=ty+tvy*t;
    t=Math.hypot(px-sx,py-sy)/Math.max(1,sp);
  }
  return {x:tx+tvx*t,y:ty+tvy*t};
}

function edgePoint(cx,cy,ang,inset){
  var m=Math.max(3,inset||6),dx=Math.cos(ang),dy=Math.sin(ang),t=1e9;
  if(dx>1e-6)t=Math.min(t,(ARENA_W-m-cx)/dx);
  if(dx<-1e-6)t=Math.min(t,(m-cx)/dx);
  if(dy>1e-6)t=Math.min(t,(ARENA_H-m-cy)/dy);
  if(dy<-1e-6)t=Math.min(t,(m-cy)/dy);
  if(!isFinite(t)||t<0)t=0;
  return {x:clamp(cx+dx*t,m,ARENA_W-m),y:clamp(cy+dy*t,m,ARENA_H-m)};
}
function trainScale(){return Math.sqrt(Math.min(ARENA_W,ARENA_H)/470);}
function spawnTrain(b,pts){
  var A=G.arena,g=CFG.arena.global;
  var acc=[0],tot=0;
  for(var i=1;i<pts.length;i++){
    tot+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    acc.push(tot);
  }
  if(tot<40)return null;
  var lsc=Math.pow(Math.min(ARENA_W,ARENA_H)/470,0.75);
  A.trains.push({side:b.i,pts:pts,acc:acc,tot:tot,s:0,age:0,
    life:Math.max(1,(g.trainLife||4)*lsc)*(b.rage?1.6:1),
    cars:8,carR:Math.max(30,56*AS.r*trainScale()),spd:b.stats.moveSpeed*(b.rage?3.0:2.4)*AS.spd,
    dir:1,hitCd:0,whistle:0.35});
  popText(b.x,b.y-b.r-24,'呜——','#ffb703',true);
  return true;
}
function beginExtend(b){
  var va=Math.atan2(b.vy,b.vx)||0;
  var ep=edgePoint(b.x,b.y,va,4);
  b.st.ex=ep.x;b.st.ey=ep.y;
  b.st.phase='extend';
}
function railAt(tr,s){
  var pts=tr.pts,acc=tr.acc;
  s=clamp(s,0,tr.tot);
  for(var i=1;i<pts.length;i++){
    if(s<=acc[i]){
      var seg=acc[i]-acc[i-1]||1,k=(s-acc[i-1])/seg;
      return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*k, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*k};
    }
  }
  return {x:pts[pts.length-1].x,y:pts[pts.length-1].y};
}
function updateTrains(dt){
  var A=G.arena,g=CFG.arena.global,bs=A.balls;
  for(var i=A.trains.length-1;i>=0;i--){
    var tr=A.trains[i];
    tr.age+=dt; tr.whistle=Math.max(0,tr.whistle-dt);
    tr.s+=tr.spd*dt*tr.dir;
    if(tr.s>tr.tot){tr.s=tr.tot;tr.dir=-1;}
    if(tr.s<0){tr.s=0;tr.dir=1;}
    if(tr.hitCd>0)tr.hitCd-=dt;
    var foes=arenaFoeUnits(tr.side);
    for(var fz=0;fz<foes.length;fz++){
    var foe=foes[fz];
    if(foe&&foe.hp>0){
      for(var c=0;c<tr.cars;c++){
        var cs=tr.s-c*Math.max(26,50*AS.r*trainScale())*tr.dir;
        var p=railAt(tr,cs);
        var dx=foe.x-p.x,dy=foe.y-p.y,dd=Math.hypot(dx,dy)||1;
        if(dd<tr.carR*3.1){
          var suck=Math.min(175,110*(1-dd/(tr.carR*3.1))+38)*AS.spd*dt;
          foe.x-=dx/dd*suck;foe.y-=dy/dd*suck;
          foe.x=clamp(foe.x,foe.r,ARENA_W-foe.r);
          foe.y=clamp(foe.y,foe.r,ARENA_H-foe.r);
        }
        if(dd<tr.carR+foe.r){
          var ux=dx/dd,uy=dy/dd,ov=tr.carR+foe.r-dd;
          foe.x=clamp(foe.x+ux*ov,foe.r,ARENA_W-foe.r);
          foe.y=clamp(foe.y+uy*ov,foe.r,ARENA_H-foe.r);
          if(tr.hitCd<=0){
            tr.hitCd=0.24;

function buildRay(ox,oy,ang,maxB,maxLen){
  var segs=[];
  var x=ox,y=oy,a=ang,rem=maxLen;
  for(var i=0;i<=maxB&&rem>0;i++){
    var dx=Math.cos(a),dy=Math.sin(a);
    var t=Infinity,hit=0,tv;
    if(dx>1e-9){tv=(ARENA_W-x)/dx;if(tv<t){t=tv;hit=1;}}
    else if(dx<-1e-9){tv=(0-x)/dx;if(tv<t){t=tv;hit=1;}}
    if(dy>1e-9){tv=(ARENA_H-y)/dy;if(tv<t){t=tv;hit=2;}}
    else if(dy<-1e-9){tv=(0-y)/dy;if(tv<t){t=tv;hit=2;}}
    if(!isFinite(t))t=rem;
    var step=Math.min(t,rem);
    var nx=x+dx*step,ny=y+dy*step;
    segs.push({x1:x,y1:y,x2:nx,y2:ny,i:i});
    rem-=step;x=nx;y=ny;
    if(step>=t-1e-6){
      if(hit===1)a=Math.PI-a;else if(hit===2)a=-a;
      x+=Math.cos(a)*0.6;y+=Math.sin(a)*0.6;
    }
    if(rem<=0)break;
  }
  return segs;
}
function distSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(l2<1e-9)return Math.hypot(px-x1,py-y1);
  var t=clamp(((px-x1)*dx+(py-y1)*dy)/l2,0,1);
  return Math.hypot(px-(x1+dx*t),py-(y1+dy*t));
}

function drawKarmaChain(hx,hy,mx,my,clen,alpha,opt){

  var n=Math.max(5,Math.round(d/Math.max(8,11*AS.r)));

  }

    var t2=j/n;
    var q=chainSegAt(hx,hy,mx,my,clen,t2);

function updateChains(dt){
  var A=G.arena,g=CFG.arena.global;
  if(!A)return;
  for(var i=A.thrown.length-1;i>=0;i--){
    var tc=A.thrown[i],host=A.balls[tc.side],foe=arenaOneFoeBall(tc.side,tc.x,tc.y);
    tc.age+=dt;tc.ang+=tc.spin*dt;
    tc.x+=tc.vx*dt;tc.y+=tc.vy*dt;
    tc.vx*=Math.pow(0.985,dt*60);tc.vy*=Math.pow(0.985,dt*60);
    if(tc.x<tc.r){tc.x=tc.r;tc.vx=Math.abs(tc.vx);}
    if(tc.x>ARENA_W-tc.r){tc.x=ARENA_W-tc.r;tc.vx=-Math.abs(tc.vx);}
    if(tc.y<tc.r){tc.y=tc.r;tc.vy=Math.abs(tc.vy);}
    if(tc.y>ARENA_H-tc.r){tc.y=ARENA_H-tc.r;tc.vy=-Math.abs(tc.vy);}
    if(!host||!foe||host.hp<=0){A.thrown.splice(i,1);continue;}
    if(!tc.hit){
      var td=Math.hypot(foe.x-tc.x,foe.y-tc.y);
      if(td<foe.r+tc.r+6*AS.range){
        tc.hit=1;
        arenaDmg(host,foe,tc.dmg,'melee');
        var kd3=Math.hypot(foe.x-tc.x,foe.y-tc.y)||1;
        foe.vx+=(foe.x-tc.x)/kd3*220*g.knockback*AS.spd;
        foe.vy+=(foe.y-tc.y)/kd3*220*g.knockback*AS.spd;
        spark(foe.x,foe.y,'#8e5cff',16,220);
        popText(foe.x,foe.y-foe.r-12,'掷链命中','#b98cff');
      }
    }
    if(tc.age>=tc.life)A.thrown.splice(i,1);
  }
  for(var j=A.reds.length-1;j>=0;j--){
    var rd=A.reds[j],hst=A.balls[rd.side];
    rd.age+=dt;
    if(rd.age<rd.delay)continue;
    rd.prog+=(rd.spd||1)*dt;
    if(!hst||hst.hp<=0){A.reds.splice(j,1);continue;}
    var rdFoes=arenaFoeUnits(rd.side);
    if(rdFoes.length===0){A.reds.splice(j,1);continue;}
    var ca=Math.cos(rd.ang),sa=Math.sin(rd.ang);
    var half=(Math.abs(ca)*ARENA_W+Math.abs(sa)*ARENA_H)*0.5;
    var cx=ARENA_W*0.5,cy=ARENA_H*0.5;
    var t0=clamp(rd.prog,0,1);
    var px=cx-ca*half+ca*(2*half)*t0;
    var py=cy-sa*half+sa*(2*half)*t0;
    rd.px=px;rd.py=py;
    rd.tick=(rd.tick||0)-dt;
    if(rd.tick<=0){
      var anyHit=false;
      for(var fi=0;fi<rdFoes.length;fi++){
        var fen=rdFoes[fi];
        var dd=Math.hypot(fen.x-px,fen.y-py);
        if(dd<fen.r+Math.max(9,13*AS.r)){
          anyHit=true;
          arenaDmg(hst,fen,rd.dmg,'chain');
          spark(fen.x,fen.y,'#ff4d6b',12,180);
          popText(fen.x,fen.y-fen.r-12,'链击','#ff6b8a');
        }
      }
      if(anyHit)rd.tick=0.35;
    }
    if(rd.age>=rd.life)A.reds.splice(j,1);
  }
}

function arenaCollideUnits(){
  var A=G.arena;if(!A||A.over)return;
  var g=CFG.arena.global;
  var u=arenaAllUnits();
  for(var i2=0;i2<u.length;i2++){
    for(var j2=i2+1;j2<u.length;j2++){
      var a=u[i2],c2=u[j2];
      if(a.dead||c2.dead)continue;
      var dx=c2.x-a.x,dy=c2.y-a.y,d=Math.hypot(dx,dy)||1,minD=a.r+c2.r;
      if(d>=minD)continue;
      var ux=dx/d,uy=dy/d,ov=minD-d;
      for(var ps=0;ps<2;ps++){
        var dq=Math.hypot(c2.x-a.x,c2.y-a.y)||1;
        var ovq=minD-dq;
        if(ovq<=0)break;
        var uxq=(c2.x-a.x)/dq,uyq=(c2.y-a.y)/dq,sh=ovq*0.55;
        a.x-=uxq*sh;a.y-=uyq*sh;c2.x+=uxq*sh;c2.y+=uyq*sh;
      }
      a.x=clamp(a.x,a.r,ARENA_W-a.r);a.y=clamp(a.y,a.r,ARENA_H-a.r);
      c2.x=clamp(c2.x,c2.r,ARENA_W-c2.r);c2.y=clamp(c2.y,c2.r,ARENA_H-c2.r);
      var rel=(c2.vx-a.vx)*ux+(c2.vy-a.vy)*uy;
      if(rel<0){
        var imp=-rel*g.ballBounce;
        a.vx-=ux*imp;a.vy-=uy*imp;c2.vx+=ux*imp;c2.vy+=uy*imp;
      }
      if(a.side===c2.side)continue;
      var impact=Math.min(2.2,Math.abs(rel)/400)*g.impactDamage*0.25;
      if(impact>0.02&&a.hitCd<=0&&c2.hitCd<=0){
        a.hitCd=c2.hitCd=0.28;
        sfx('melee');
        var chgA=(a.skill==='charge'),chgC=(c2.skill==='charge');
        var dashA=(a.st.phase==='dash'||a.st.phase==='lunge'||a.st.phase==='charge');
        var dashC=(c2.st.phase==='dash'||c2.st.phase==='lunge'||c2.st.phase==='charge');
        var ar=Math.abs(rel);
        if(!(SCR.cdS>0)){
          SCR.cdS=0.60;
          var amp2=clamp(ar/220,0.8,5.0);
          if((chgA&&dashA)||(chgC&&dashC))amp2*=2.0;
          scrShake(amp2,0.10);
        }
      arenaDmg(a,c2,a.stats.atk*impact*wdImpactMul(a),'hit');
        arenaDmg(c2,a,c2.stats.atk*impact*wdImpactMul(c2),'hit');
        spark((a.x+c2.x)/2,(a.y+c2.y)/2,'#ffffff',5,120);
      }
    }
  }
}

function cineWrapLine(str,maxW,fs0,minFs,fontOf){
  var last=null;
  for(var fs=fs0;fs>=minFs;fs-=1){
    ctx.font=fontOf(fs);
    var w1=ctx.measureText(str).width;
    last={lines:[str],fs:fs,w:w1};
    if(w1<=maxW)return last;
    var best=null,bestScore=-1e9;
    for(var i=1;i<str.length;i++){
      var a=str.slice(0,i),b2=str.slice(i);
      var wa=ctx.measureText(a).width,wb=ctx.measureText(b2).width;
      if(wa>maxW||wb>maxW)continue;
      var punct=('；，。、！？：；,;'.indexOf(str.charAt(i-1))>=0)?1:0;
      var score=punct*10000-Math.abs(wa-wb);
      if(score>bestScore){bestScore=score;best={a:a,b:b2,w:Math.max(wa,wb)};}
    }
    if(best)return {lines:[best.a,best.b],fs:fs,w:best.w};
  }
  ctx.font=fontOf(minFs);
  var n2=Math.ceil(str.length/2);
  return {lines:[str.slice(0,n2),str.slice(n2)],fs:minFs,w:maxW};
}

function roundRectPath(x,y,w,h,r){

  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);

}
function hexA(hex,a){
  if(!hex||hex[0]!=='#')return 'rgba(255,255,255,'+a+')';
  var h=hex.slice(1);
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function updateClones(dt){
  var A=G.arena;if(!A||A.over)return;
  var g=CFG.arena.global;
  var maxN=clamp(g.splMax==null?3:g.splMax,1,16);
  var maxG=clamp(g.splMaxGen==null?4:g.splMaxGen,1,6);
  for(var i=A.clones.length-1;i>=0;i--){
    var c=A.clones[i];
    if(c.ally)continue;
    if(c.binComp){
      if(c.hp<=0&&!c.dead)arenaCheckKO(c,null);
      continue;
    }
    if(c.hp<=0&&!c.dead)arenaCheckKO(c,null);
    if(c.dead||c.hp<=0){A.clones.splice(i,1);continue;}
    c.rage=c.host.rage?1:0;
    c.x=clamp(c.x,c.r,ARENA_W-c.r);
    c.y=clamp(c.y,c.r,ARENA_H-c.r);
    if(c.aoeCd>0)c.aoeCd-=dt;
    if(c.flash>0)c.flash-=dt;
    if(c.slow>0)c.slow=Math.max(0,c.slow-dt*0.5);
    if(c.curse>0)c.curse=Math.max(0,c.curse-dt);
    if(c.atkDown>0)c.atkDown=Math.max(0,c.atkDown-dt*0.3);
    if(c.immune>0)c.immune-=dt;
    if(c.confine>0)c.confine-=dt;
    if(c.hitCd>0)c.hitCd-=dt;
    if(c.hold>0){c.hold-=dt;continue;}
    if(c.confine>0){
      c.cd.atk-=dt;
      if(c.cd.atk<=0){
        c.cd.atk=1.35;
        var fq=arenaPickFoe(c.side,c.x,c.y);

          var caq=Math.atan2(fq.y-c.y,fq.x-c.x)+rnd(-0.25,0.25);
          G.arena.bullets.push({x:c.x+Math.cos(caq)*(c.r+4),y:c.y+Math.sin(caq)*(c.r+4),
            vx:Math.cos(caq)*CFG.arena.global.bulletSpeed*0.75,
            vy:Math.sin(caq)*CFG.arena.global.bulletSpeed*0.75,r:5,
            dmg:c.stats.atk*0.30,side:c.side,life:CFG.arena.global.bulletLife,
            homing:false,color:'#8a97a8'});
        }
      }
      continue;
    }
    var foe=arenaPickFoe(c.side,c.x,c.y);
    if(!foe)continue;
    var dx=foe.x-c.x,dy=foe.y-c.y;
    var spd=c.stats.moveSpeed*(c.rage?1.15:1)*clamp(g.splCloneSpd==null?1:g.splCloneSpd,0.3,2);
    if(c.slow>0)spd*=(1-c.slow);
    var want=Math.atan2(dy,dx)+rnd(-0.30,0.30);
    var ca=Math.atan2(c.vy,c.vx);
    var diff=((want-ca+Math.PI*3)%(Math.PI*2))-Math.PI;
    ca+=clamp(diff,-2.4*dt,2.4*dt);
    c.vx=Math.cos(ca)*spd;c.vy=Math.sin(ca)*spd;
    c.x+=c.vx*dt;c.y+=c.vy*dt;
    if(c.x<c.r){c.x=c.r;c.vx=Math.abs(c.vx)*g.wallBounce;}
    if(c.x>ARENA_W-c.r){c.x=ARENA_W-c.r;c.vx=-Math.abs(c.vx)*g.wallBounce;}
    if(c.y<c.r){c.y=c.r;c.vy=Math.abs(c.vy)*g.wallBounce;}
    if(c.y>ARENA_H-c.r){c.y=ARENA_H-c.r;c.vy=-Math.abs(c.vy)*g.wallBounce;}
    c.trail.push(c.x,c.y);if(c.trail.length>10)c.trail.splice(0,2);
    c.cd.atk-=dt;

      spark(c.x,c.y,'#66ffb2',4,100);

    c.st.splAct=(c.st.splAct||0)-dt/Math.max(0.05,splitNearMul(c));
    if(c.st.splAct<=0&&(c.st.splCast||0)<=0&&c.gen<maxG&&splitAllowed(c)){
      c.st.splAct=Math.max(1.2,g.splCd==null?3.0:g.splCd)
                  *(c.rage?clamp(g.splRageCdMul==null?0.4:g.splRageCdMul,0.1,1):1)
                  *clamp(g.splCloneCdMul==null?1.6:g.splCloneCdMul,0.2,4);

  }

function updateReapers(dt){

function sansThreat(b){
  var A=G.arena;if(!A)return null;
  var g=CFG.arena.global;
  var sense=clamp(g.sansBlinkSense==null?150:g.sansBlinkSense,40,600)*AS.range;
  var best=null,bd=1e18;
  for(var i=0;i<A.bullets.length;i++){
    var p=A.bullets[i];
    if(p.side===b.i)continue;
    var dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy)||1;
    if(d>sense)continue;
    var vl=Math.hypot(p.vx,p.vy)||1;
    var dot=(dx*p.vx+dy*p.vy)/(d*vl);
    if(dot<0.55)continue;
    var eta=d/vl;
    if(eta<bd){bd=eta;best={x:p.x,y:p.y,ang:Math.atan2(p.vy,p.vx),eta:eta,kind:'shot'};}
  }
  var foes=arenaFoeUnits(b.i);
  for(var k=0;k<foes.length;k++){
    var f=foes[k];
    var fx=b.x-f.x,fy=b.y-f.y,fd=Math.hypot(fx,fy)||1;
    if(fd>sense*0.8)continue;
    var fv=Math.hypot(f.vx,f.vy)||1;
    if(fv<f.stats.moveSpeed*1.25*AS.spd)continue;
    if((fx*f.vx+fy*f.vy)/(fd*fv)<0.6)continue;
    var eta2=fd/fv;
    if(eta2<bd){bd=eta2;best={x:f.x,y:f.y,ang:Math.atan2(f.vy,f.vx),eta:eta2,kind:'rush'};}
  }
  return best;
}

function karmaCardHeal(b){

    b.karmaAbsorb=Math.min(cap,(b.karmaAbsorb||0)+golded);

function updateKarmaAllies(dt){

    if(c.slow>0)c.slow=Math.max(0,c.slow-dt*0.5);

function rageEnqueue(b,override){
  var A=G.arena;if(!A)return;
  if(!CFG.arena.global.rage)return;
  if(!b.rage)return;
  var def=override||RAGE_CINE[b.skill];
  if(!def||!def.line)return;
  sfx('rage');
  var key=b.i+'|'+(def.form||'');
  for(var qi=0;qi<A.rageQ.length;qi++)if(A.rageQ[qi].key===key)return;
  A.rageQ.push({key:key,side:b.i,name:b.name||'',color:b.color,
    line:def.line,form:def.form||'',skill:b.skill,tagText:def.tagText||'',
    dur:def.dur||1.75});
  if(A.rageQ.length>1){
    for(var sj=A.rageQ.length-1;sj>0;sj--){
      var sk=Math.floor(Math.random()*(sj+1));
      var tmp=A.rageQ[sj];A.rageQ[sj]=A.rageQ[sk];A.rageQ[sk]=tmp;
    }
  }
}
function rageCineStep(dt){
  var A=G.arena;if(!A)return false;
  if(A.cine){
    A.cine.t+=dt;
    if(A.cine.t>=(A.cine.dur||1.75))A.cine=null;
    return true;
  }
  while(A.rageQ.length){
    var e=A.rageQ.shift();
    var bb=A.balls[e.side];
    if(!bb||bb.dead)continue;
    A.cine={side:e.side,name:e.name,color:e.color,line:e.line,form:e.form,
            skill:e.skill,tagText:e.tagText,t:0,dur:e.dur||1.75};
    return true;
  }
  return false;
}

function phaseHeal(b,ratio,label){
  if(!b)return 0;
  var gain=0,r=clamp(ratio||0,0,2);
  if(r>0){
    var before=b.hp;
    b.hp=Math.min(b.maxHp,b.hp+b.maxHp*r);
    gain=b.hp-before;
  }
  phaseHealFx(b,label,gain);
  return gain;
}

function tumorPath(x,y,r,seed,t,wob,amp){

    var a=i/N*6.283;
    var d=Math.sin(a*3+seed+t*0.7)*0.5+Math.sin(a*5-seed*1.7+t*1.1)*0.3+Math.sin(a*2+seed*2.3-t*0.55)*0.2;
    var rr=r*(1+wob*amp*d);
    var px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }

function tumorVessels(x,y,r,seed,t,n,a){

    var steps=3;
    for(var k=1;k<=steps;k++){
      var ak=a0+Math.sin(seed*3+i*2.1+k*1.7+t*0.6)*0.55;
      var rr=r*(0.32+0.72*k/steps);

      ctx.lineTo(px,py);
    }
    ctx.stroke();
    var bl=r*0.16;
    ctx.beginPath();
    ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(a0+0.7)*bl,py+Math.sin(a0+0.7)*bl);
    ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(a0-0.7)*bl,py+Math.sin(a0-0.7)*bl);
    ctx.stroke();
  }
  ctx.restore();
}

function nebUpdate(dt){
  var A=G.arena;if(!A||!A.nebs)return;
  var g=nebG();
  var bs=A.balls,N=arenaN();
  var slowV=clamp(nebN(g,'nebSlow',0.45),0,0.92);
  var lostD=Math.max(0.15,nebN(g,'nebLostDur',0.55));
  var compT=Math.max(0.5,nebN(g,'nebCompressT',4.5));
  var compD=clamp(nebN(g,'nebCompressDmg',0.34),0,3);
  var compTick=Math.max(0.1,nebN(g,'nebCompressTick',0.7));
  var starRate=Math.max(0.1,nebN(g,'nebStarRate',0.85));
  var snGap=Math.max(0.1,nebN(g,'nebSnGap',0.45));

        if(foe){
          var host=A.balls[n.side];
          var atk=host?host.stats.atk:20;
          var dmg=atk*clamp(nebN(g,'nebStarDmg',0.55),0.05,4);
          var aim=predictAim(n.x,n.y,foe.x,foe.y,foe.vx,foe.vy,g.bulletSpeed*0.8);
          var dx=aim.x-n.x,dy=aim.y-n.y,d=Math.hypot(dx,dy)||1;
          A.bullets.push({x:n.x+dx/d*(n.r*0.3),y:n.y+dy/d*(n.r*0.3),
            vx:dx/d*g.bulletSpeed*0.8,vy:dy/d*g.bulletSpeed*0.8,r:5,
            dmg:dmg,side:n.side,life:g.bulletLife,homing:false,color:'#ffd98a'});
          A.nebFx.push({x:n.x+dx/d*(n.r*0.3),y:n.y+dy/d*(n.r*0.3),r:8,age:0,life:0.3,kind:'star'});
        }
      }
      if(n.snLeft>0){
        n.snT-=dt;
        if(n.snT<=0){n.snT=snGap;n.snLeft--;nebSnFire(n,A.balls[n.side]);}
      }else{
        n.snCd-=dt;
        if(n.snCd<=0){n.snCd=snCd;nebSupernova(n,A.balls[n.side]);}
      }
    }
    for(var q=0;q<N;q++){
      var u=bs[q];
      if(!u||u.dead||u.hp<=0||u.i===n.side)continue;
      var dd=Math.hypot(u.x-n.x,u.y-n.y);
      if(dd>n.r+u.r*0.35)continue;
      u.slow=Math.max(u.slow,slowV);
      u.lost=Math.max(u.lost||0,lostD);
      if(n.comp){
        u.vx*=Math.pow(0.55,dt*60);u.vy*=Math.pow(0.55,dt*60);
        n.mx=(n.mx||0)-dt;
        if(!(n.mx>0)){
          n.mx=compTick;
          var host2=A.balls[n.side];
          if(host2)arenaDmg(host2,u,(host2.stats.atk)*compD,'nebula');
        }
      }
    }
    for(var c2=0;c2<A.clones.length;c2++){
      var cl=A.clones[c2];
      if(!cl||cl.dead||cl.i===n.side)continue;
      if(Math.hypot(cl.x-n.x,cl.y-n.y)>n.r+cl.r*0.35)continue;
      cl.slow=Math.max(cl.slow||0,slowV);
      if(n.comp){cl.vx*=Math.pow(0.55,dt*60);cl.vy*=Math.pow(0.55,dt*60);}
    }
  }
  for(var s2=A.nebSns.length-1;s2>=0;s2--){
    var sn=A.nebSns[s2];
    sn.age+=dt;
    sn.r+=sn.maxR*2.0*dt;

    for(var u2=0;u2<N;u2++){
      var tb=bs[u2];
      if(!tb||tb.dead||tb.hp<=0||tb.i===sn.side)continue;
      if(sn.hit&(1<<u2))continue;
      var sd=Math.hypot(tb.x-sn.x,tb.y-sn.y);
      if(sd>sn.r+tb.r||sd<sn.r-sn.maxR*0.45)continue;
      sn.hit|=(1<<u2);
      var host3=A.balls[sn.side];
      if(host3)arenaDmg(host3,tb,sn.dmg,'nova');
      spark(tb.x,tb.y,'#ffe9b0',14,240);
    }
  }
  for(var f2=A.nebFx.length-1;f2>=0;f2--){
    A.nebFx[f2].age+=dt;
    if(A.nebFx[f2].age>=A.nebFx[f2].life)A.nebFx.splice(f2,1);
  }

function nebStarsUpdate(dt){
  var A=G.arena;if(!A||!A.nebStars)return;

  for(var i=A.nebStars.length-1;i>=0;i--){
    var st=A.nebStars[i];
    st.age+=dt;st.ph+=dt*3.4;
    if(st.age>=st.life){spark(st.x,st.y,'#ffd98a',14,220);A.nebStars.splice(i,1);continue;}
    var foe=arenaOneFoeBall(st.side,st.x,st.y)||arenaPickFoe(st.side,st.x,st.y);
    var host=A.balls[st.side];
    if(!host||host.dead){A.nebStars.splice(i,1);continue;}
    if(foe){
      var dx=foe.x-st.x,dy=foe.y-st.y,d=Math.hypot(dx,dy)||1;
      var sp=host.stats.moveSpeed*1.15*AS.spd;
      if(st.type==='ram'){
        st.vx+=(dx/d*sp-st.vx)*Math.min(1,dt*2.2);
        st.vy+=(dy/d*sp-st.vy)*Math.min(1,dt*2.2);
        if(d<st.r+foe.r+2&&!(st.hitCd>0)){
          st.hitCd=0.5;
          arenaDmg(host,foe,st.dmgRam,'nova');

          st.vx-=kx*0.5;st.vy-=kyy*0.5;
          spark(foe.x,foe.y,'#ffd98a',18,260);
        }
      }else{
        var want=d>160?1:(d<90?-1:0);
        st.vx+=(dx/d*sp*want-st.vx)*Math.min(1,dt*2.0);
        st.vy+=(dy/d*sp*want-st.vy)*Math.min(1,dt*2.0);
        st.vx+=-dy/d*sp*0.45*dt*2.0;st.vy+=dx/d*sp*0.45*dt*2.0;
        st.cd-=dt;
        if(st.cd<=0){
          st.cd=0.75;
          var aim=predictAim(st.x,st.y,foe.x,foe.y,foe.vx,foe.vy,g.bulletSpeed*0.85);
          var ax=aim.x-st.x,ay=aim.y-st.y,ad=Math.hypot(ax,ay)||1;

            dmg:st.dmgShoot,side:st.side,life:g.bulletLife,homing:false,color:'#fff1c2'});
        }
      }
    }
    if(st.hitCd>0)st.hitCd-=dt;
    var vl=Math.hypot(st.vx,st.vy),vmax=host.stats.moveSpeed*1.5*AS.spd;
    if(vl>vmax){st.vx*=vmax/vl;st.vy*=vmax/vl;}
    st.x+=st.vx*dt;st.y+=st.vy*dt;
    if(st.x<st.r){st.x=st.r;st.vx=Math.abs(st.vx);}
    if(st.x>ARENA_W-st.r){st.x=ARENA_W-st.r;st.vx=-Math.abs(st.vx);}
    if(st.y<st.r){st.y=st.r;st.vy=Math.abs(st.vy);}
    if(st.y>ARENA_H-st.r){st.y=ARENA_H-st.r;st.vy=-Math.abs(st.vy);}
  }
}

function bhQuasarTick(b,foe,dt){
  var g=CFG.arena.global,s=b.stats;
  b.st.phase='jet';
  var qx=b.x-foe.x,qy=b.y-foe.y,qd=Math.hypot(qx,qy)||1;
  var qux=qx/qd,quy=qy/qd;
  var gain=(g.quasarGain==null?1:g.quasarGain);
  var qd0=Math.hypot(b.x-foe.x,b.y-foe.y)||1;
  if(qd0<=Math.max(60,(g.bhPullRange==null?380:g.bhPullRange))*AS.range*1.15)
    b.accr=clamp((b.accr||0)+dt*gain*(0.34+0.38*(1-clamp(qd0/(340*AS.range),0,1))),0,1);
  var ac=b.accr;
  var orb=(b.r+foe.r+38*AS.range);
  var bhR2=bhRangeOf(g.bhPullRange==null?380:g.bhPullRange)*1.15;
  if(foe.immune>0){
    b.st.lock=0;
  }else{
    var pull=b.stats.moveSpeed*((g.quasarPull==null?2.8:g.quasarPull)*(1+ac*0.50))*AS.spd;
    pull*=clamp(1-Math.max(0,(qd-bhR2*0.45))/(bhR2*0.55),0,1);
    var damp=Math.max(0.55,0.90-ac*0.30);
    if(qd>bhR2){
      bhOor(b,'oor','超出引力范围','#ffe27a');
    }else{
      b.st.oor=0;
      foe.vx*=damp;foe.vy*=damp;
      if(qd>orb){
        foe.x+=qux*pull*dt;foe.y+=quy*pull*dt;
      }else if(qd<orb-14*AS.range){
        foe.x-=qux*pull*0.55*dt;foe.y-=quy*pull*0.55*dt;
      }
      b.cd.qtick-=dt;
      if(b.cd.qtick<=0){
        b.cd.qtick=Math.max(0.08,g.quasarTick||0.30);
        var fall=clamp(1-qd/(Math.hypot(ARENA_W,ARENA_H)*0.50),0.34,1);
        arenaDmg(b,foe,s.atk*(g.quasarDmg==null?1:g.quasarDmg)*0.42*(1+ac*1.00)*fall,'dot');
        for(var qs=0;qs<5+Math.round(ac*6);qs++)
          spark(foe.x+rnd(-14,14),foe.y+rnd(-14,14),ac>0.55?'#fff3c4':'#ffcf6b',2,110);
      }
      if(qd<orb*1.7)b.st.lock+=dt;
      var lk=(g.quasarLock==null?3.2:g.quasarLock)*Math.pow(Math.min(ARENA_W,ARENA_H)/470,1.5);
      if(b.st.lock>=Math.max(0.8,lk)){
        b.st.lock=0;foe.immune=1.60;
        foe.vx=-qux*b.stats.moveSpeed*2.2*AS.spd;
        foe.vy=-quy*b.stats.moveSpeed*2.2*AS.spd;
        b.accr=Math.max(0,ac-0.30);
        popText(foe.x,foe.y-foe.r-12,'挣脱','#ffe27a',true);
        spark(foe.x,foe.y,'#ffe27a',18,230);
      }
    }
  }
  b.st.qs-=dt;
  if(b.st.qs<=0){
    b.st.qs=Math.max(0.028,0.075-ac*0.045);
    var n=2+Math.round(ac*4);
    for(var qi=0;qi<n;qi++)arenaAcc(b,ac);
  }
  b.st.ja+=0.62*dt;
  b.st.jt-=dt;
  if(b.st.jt<=0){
    b.st.jt=Math.max(0.09,g.quasarGap||0.16);
    arenaJet(b,b.st.ja,ac);
  }
}

  ctx.lineWidth=Math.max(1,r*0.10);
  for(var i=0;i<4;i++){
    var a0=t*(quasar?1.25:0.75)+i*(6.283/4);
    var rr=R*(1.28+i*0.16);
    ctx.strokeStyle=(quasar?'rgba(255,232,178,':'rgba(200,176,255,')+(0.34-i*0.06).toFixed(2)+')';
    ctx.beginPath();ctx.arc(x,y,rr,a0,a0+1.05);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,rr,a0+Math.PI,a0+Math.PI+0.72);ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,250,236,.85)';ctx.lineWidth=Math.max(1,r*0.10);
  ctx.beginPath();ctx.arc(x,y,r*0.58,0,6.283);ctx.stroke();
  ctx.restore();
  ctx.fillStyle=quasar?'rgba(255,226,150,.95)':'rgba(235,225,255,.92)';
  ctx.font='700 9px -apple-system,sans-serif';ctx.textAlign='center';
  ctx.fillText(quasar?'类星体':'引力透镜',x,y+r+13);
}
function binIsBH(b){

}
function binNoBullet(b){

function binPrimaryAttack(b,foe,dt){
  var s=b.st.bin,g=CFG.arena.global;

  if(binNoBullet(b)){
    if(b.rage&&foe&&!foe.dead&&foe.hp>0){
      sfx('quasar');
      if(!(SCR.cdK>0)){SCR.cdK=0.50;scrShake(3.2,0.20);scrGlitch(0.22,0.8);}
      bhQuasarTick(b,foe,dt);
      return;
    }
    var bf3=arenaPickFoe(b.i,b.x,b.y)||arenaOneFoeBall(b.i);
    if(bf3)wdPumpTick(b,bf3,dt,clamp(binG('binPumpR',240),60,600));
    if(s.pull&&s.phase!=='final')binPull(b,dt);
    return;
  }
  b.cd.atk-=dt;
  if(b.cd.atk<=0){
    b.cd.atk=0.62/Math.max(0.2,b.stats.atkSpeed);
    var aim=predictAim(b.x,b.y,foe.x,foe.y,foe.vx,foe.vy,g.bulletSpeed*(s.spdMul||1));
    binBullet(b,aim.x,aim.y,clamp(binG('binBulletDmg',1.0),0.2,3)*0.60*dmgMul,(s.spdMul||1));
    spark(b.x,b.y,b.color,4,110);
  }
  if(s.pull&&s.phase!=='final')binPull(b,dt);
  if(s.beam)binBeams(b,dt);
}
function binPull(b,dt){
  var s=b.st.bin;
  var R=clamp(binG('binPullR',150),40,500)*AS.range;
  var foes=arenaFoeUnits(b.i);
  for(var k=0;k<foes.length;k++){
    var f=foes[k];if(!f||f.dead||f.hp<=0)continue;
    var dx=b.x-f.x,dy=b.y-f.y,d=Math.hypot(dx,dy)||1;
    if(d>R)continue;
    var t=1-d/R;
    var acc=clamp(binG('binPull',0.55),0.05,2)*420*t;
    f.vx+=dx/d*acc*dt;f.vy+=dy/d*acc*dt;
  }
}
function binDistSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;
  var t=L>0?clamp(((px-x1)*dx+(py-y1)*dy)/L,0,1):0;
  var qx=x1+dx*t,qy=y1+dy*t;
  return Math.hypot(px-qx,py-qy);
}
function binBeams(b,dt){

    mul:clamp(binG('binBeamDmg',0.26),0.05,1.5),

function updateBinFx(dt){

      *((s.wreckP)?clamp(binG('binWreckAtk',0.70),0.2,1.2):1),(s.spdMul||1));
    spark(c.x,c.y,c.color,3,90);

function updateBinary(dt){
  var A=G.arena;if(!A)return;
  var N=arenaN();
  for(var i=0;i<N;i++){
    var b=A.balls[i];
    if(!b||b.skill!=='binary'||!b.st.bin)continue;
    var s=b.st.bin;
    if(s.phase==='main'&&!s.trans){binCheckEvolve(b);binTrySub(b);binTryMerger(b);}
    var c=binComp(b);
    if(c&&!c.dead){
      if(s.wreckC){
        s.binAng=(s.binAng||0)+1.1*dt;
        var ax=b.x+Math.cos(s.binAng)*(b.r+c.r+6),ay=b.y+Math.sin(s.binAng)*(b.r+c.r+6);
        var wx2=clamp(ax,c.r,ARENA_W-c.r),wy2=clamp(ay,c.r,ARENA_H-c.r);
        c.vx=(wx2-c.x)/Math.max(dt,0.0016);c.vy=(wy2-c.y)/Math.max(dt,0.0016);
        c.x=wx2;c.y=wy2;
        binCompCapSpd(c,b);
      }else if(s.sym){
        if(s.cx==null){s.cx=(b.x+c.x)*0.5;s.cy=(b.y+c.y)*0.5;s.prevX=b.x;s.prevY=b.y;}
        s.cx+=b.x-(s.prevX==null?b.x:s.prevX);
        s.cy+=b.y-(s.prevY==null?b.y:s.prevY);
        s.binAng=(s.binAng||0)+clamp(binG('binOrbitSpd',1.5),0.2,5)*dt;
        var rr2=(c.st.orbitR||(b.r*2.0+18*AS.r));
        var ox=Math.cos(s.binAng)*rr2,oy=Math.sin(s.binAng)*rr2*0.62;
        b.x=clamp(s.cx+ox,b.r,ARENA_W-b.r);b.y=clamp(s.cy+oy,b.r,ARENA_H-b.r);
        c.x=clamp(s.cx-ox,c.r,ARENA_W-c.r);c.y=clamp(s.cy-oy,c.r,ARENA_H-c.r);
        c.vx=(c.x-(c.px==null?c.x:c.px))/Math.max(dt,0.0016);
        c.vy=(c.y-(c.py==null?c.y:c.py))/Math.max(dt,0.0016);
        b.vx=(b.x-(s.prevX==null?b.x:s.prevX))/Math.max(dt,0.0016);
        b.vy=(b.y-(s.prevY==null?b.y:s.prevY))/Math.max(dt,0.0016);
        binCompCapSpd(c,b);
        c.px=c.x;c.py=c.y;
        s.prevX=b.x;s.prevY=b.y;
        c.trail.push(c.x,c.y);if(c.trail.length>10)c.trail.splice(0,2);
        binCompShoot(b,c,s,dt);
      }else{
        var orb=clamp(binG('binOrbitSpd',1.5),0.2,5)*(s.dual?1.5:1);
        c.st.orbit=(c.st.orbit||0)+orb*dt;
        var rr=(c.st.orbitR||(b.r*2.3+16*AS.r))*(s.wdC?0.72:1);
        if(s.merging)rr*=clamp(1-(s.ch||0)*0.8,0.2,1);
        var tx=b.x+Math.cos(c.st.orbit)*rr,ty=b.y+Math.sin(c.st.orbit)*rr*0.62;
        var nx=clamp(tx,c.r,ARENA_W-c.r),ny=clamp(ty,c.r,ARENA_H-c.r);
        c.px=c.x;c.py=c.y;
        c.x=nx;c.y=ny;
        c.vx=(c.x-c.px)/Math.max(dt,0.0016);c.vy=(c.y-c.py)/Math.max(dt,0.0016);
        binCompCapSpd(c,b);
        c.trail.push(c.x,c.y);if(c.trail.length>10)c.trail.splice(0,2);
        binKeepGap(b,c);
        binCompShoot(b,c,s,dt);
      }
    }
    if(s.wreckP&&c&&!c.dead){
      s.binAng=(s.binAng||0)+1.1*dt;
      var wx=clamp(c.x+Math.cos(s.binAng+2.2)*(c.r+b.r+6),b.r,ARENA_W-b.r);
      var wy=clamp(c.y+Math.sin(s.binAng+2.2)*(c.r+b.r+6),b.r,ARENA_H-b.r);
      b.vx=(wx-b.x)/Math.max(dt,0.0016);b.vy=(wy-b.y)/Math.max(dt,0.0016);
      b.x=wx;b.y=wy;
      binCompCapSpd(b,c);
    }
  }
}
function binSideAlive(side){

function arenaAttack(b,foe,dt){

  var ux=dx/d,uy=dy/d;

    b.st.katTornado-=dt;
    b.st.katTornadoTick-=dt;
    if(b.st.katTornadoTick<=0){
      b.st.katTornadoTick=Math.max(0.08,CFG.arena.global.ktArashiTick||0.24);
      var tsrc=(G.arena&&G.arena.balls[b.st.katTornadoSrc==null?0:b.st.katTornadoSrc])||null;

        spark(b.x,b.y,'#b6ffd8',6,150);

      b.cd.atk=1.35;

      G.arena.bullets.push({x:b.x+Math.cos(ca)*(b.r+4),y:b.y+Math.sin(ca)*(b.r+4),
        vx:Math.cos(ca)*g.bulletSpeed*0.75,vy:Math.sin(ca)*g.bulletSpeed*0.75,r:5,
        dmg:s.atk*0.30,side:b.i,life:g.bulletLife,homing:false,color:'#8a97a8'});

      } else {

        }
        break;
      }
      if(b.st.phase==='pull'){
        sfx('bhPull');
        b.st.t-=dt;
        var gx=b.x-foe.x,gy=b.y-foe.y,gd=Math.hypot(gx,gy)||1;
        var gux=gx/gd,guy=gy/gd;
        var bhR=bhRangeOf(g.bhPullRange==null?380:g.bhPullRange);
        var pullFall=clamp(1-Math.max(0,(gd-bhR*0.45))/(bhR*0.55),0,1);
        var pull=b.stats.moveSpeed*2.4*AS.spd*pullFall;
        if(gd>bhR){
          bhOor(b,'oor','超出引力范围','#a05cff');
          b.st.oorT=(b.st.oorT||0)+dt;
          if(b.st.oorT>0.45){
            b.st.oorT=0;b.st.oor=0;
            b.st.phase='idle';b.st.t=0;
            b.cd.skill=Math.max(0.5,g.bhCD||3.2)/Math.max(0.2,s.atkSpeed);
          }
        }else{
          b.st.oor=0;b.st.oorT=0;
        if(gd>b.r+foe.r+6*AS.range){
          foe.x+=gux*pull*dt;foe.y+=guy*pull*dt;
          foe.vx*=0.55;foe.vy*=0.55;
          foe.hold=0.2;
        }else{
          foe.x=b.x-gux*(b.r+foe.r);foe.y=b.y-guy*(b.r+foe.r);
          foe.vx=0;foe.vy=0;foe.hold=0.25;
          if(b.cd.tick<=0){
            arenaDmg(b,foe,s.atk*1.02,'dot');
            b.cd.tick=0.30/Math.max(0.2,s.atkSpeed);
          }
          spark(foe.x+rnd(-8,8),foe.y+rnd(-8,8),'#a05cff',3,90);
        }
        if(b.st.t<=0){
          b.st.phase='idle';
          var ex=foe.x-b.x,ey=foe.y-b.y,ed=Math.hypot(ex,ey)||1;
          if(ed<1){ex=(b.i===0?1:-1);ey=-1;ed=Math.hypot(ex,ey);}
          foe.vx=ex/ed*b.stats.moveSpeed*2.0*AS.spd;
          foe.vy=ey/ed*b.stats.moveSpeed*2.0*AS.spd;
          foe.hold=0;
          popText(foe.x,foe.y-foe.r-12,'挣脱','#c9a6ff',true);
          spark(foe.x,foe.y,'#c9a6ff',16,220);
          b.cd.skill=Math.max(0.5,g.bhCD)/Math.max(0.2,s.atkSpeed);
        }
        }
      }else{
        if(b.cd.skill<=0){
          b.st.phase='pull';
          b.st.t=Math.max(0.2,g.bhHold);
          b.cd.tick=0;
          popText(b.x,b.y-b.r-18,'引力','#a05cff');
        }
      }
      break;
  }
}
function bhRangeOf(range){
  var g=CFG.arena.global;
  var r=Math.max(60,range)*AS.range;
  var cap=(g&&g.bhRangeCap)||0;
  if(cap>0)r=Math.min(r,Math.max(60,cap)*AS.range);
  return r;
}
function bhOor(b,key,msg,color){
  if(!b.st)return;
  if(!b.st[key]){b.st[key]=1;popText(b.x,b.y-b.r-18,msg||'超出引力范围',color||'#a05cff');}
}
function arenaMove(b,foe,dt){
  var g=CFG.arena.global;
  if(b.hold>0)return;
  if(b.st.wdWreck||b.st.wdTrans){
    b.vx*=Math.pow(0.02,dt*60);b.vy*=Math.pow(0.02,dt*60);return;
  }
  if(b.skill==='refract'&&(b.st.rfRay||(b.st.rfPrism||0)>0)){
    b.vx*=Math.pow(0.02,dt*60);b.vy*=Math.pow(0.02,dt*60);
    return;
  }
  var dashing=(b.st.phase==='dash'||b.st.phase==='lunge');
  if(dashing){sfx('dash');if(!(SCR.cdK>0)){SCR.cdK=0.45;scrShake(2.2,0.12);}}
  var mul=(b.skill==='karma'&&(b.st.ledger>0||(b.karmaVigor||0)>0))?1.3:
          ((b.skill==='conductor'&&(b.st.phase==='lay'||b.st.phase==='approach'||b.st.phase==='extend'))?(b.rage?3.0:2.6):
          ((b.st.phase==='dash')?(b.rage?3.5:3.2):((b.st.phase==='lunge')?(b.rage?3.6:2.6):
          ((b.st.phase==='pull'||b.st.phase==='jet')?0.6:((b.st.phase==='charge')?0.25:1)))));
  var target=b.stats.moveSpeed*AS.spd*mul*rageSpdMul(b)*(1-clamp(b.slow||0,0,0.85));
  if(b.skill==='karma'&&(b.karmaVigor||0)>0)
    target*=clamp(CFG.arena.global.karmaVigorSpd==null?1.35:CFG.arena.global.karmaVigorSpd,1,2.5);
  if(b.skill==='sonar'&&b.rage)target*=1.35;
  if(b.skill==='refract'&&b.rage&&b.st.rfPhase==='giant')
    target*=clamp(CFG.arena.global.rfGiantSpd==null?0.55:CFG.arena.global.rfGiantSpd,0.1,1.5);
  var v=Math.hypot(b.vx,b.vy);
  if(v<1){var a0=rnd(0,6.283);b.vx=Math.cos(a0)*target;b.vy=Math.sin(a0)*target;v=target;}
  var nv=lerp(v,target,Math.min(1,dt*(dashing?9:2.5)));
  b.vx=b.vx/v*nv;b.vy=b.vy/v*nv;
  if(!dashing&&g.steerBias>0){
    var dx=foe.x-b.x,dy=foe.y-b.y;
    var ang=Math.atan2(b.vy,b.vx),ta=Math.atan2(dy,dx);
    var diff=((ta-ang+Math.PI*3)%(Math.PI*2))-Math.PI;
    var sb=g.steerBias*((b.skill==='conductor'&&b.st.phase==='lay')?3.0:1)*((b.skill==='karma'&&b.st.ledger>0)?2.6:1)*((b.skill==='karmic'&&(b.st.dry||0)>1.8)?2.4:1);
    if(b.skill==='grave')sb*=3.2;
    if(b.skill==='sonar'&&b.rage&&SPECIES_INTEL[foe.skill]&&SPECIES_INTEL[foe.skill].pull)sb*=0.12;
    ang+=diff*Math.min(0.5,sb*dt);
    var s2=Math.hypot(b.vx,b.vy)||1;
    b.vx=Math.cos(ang)*s2;b.vy=Math.sin(ang)*s2;
  }
  if(b.skill==='sonar'&&G.arena&&!dashing){
    var sg2=CFG.arena.global;
    var dodge=clamp(sg2.snDodge==null?0.55:sg2.snDodge,0,1)*(b.rage?1.0:0.62);
    var threat=null,td2=1e9;
    for(var bi2=0;bi2<G.arena.bullets.length;bi2++){
      var bu3=G.arena.bullets[bi2];
      if(bu3.side===b.i)continue;
      if(!(bu3.det>0)&&!b.rage)continue;
      var ddx=bu3.x-b.x,ddy=bu3.y-b.y,dd=Math.hypot(ddx,ddy)||1;
      if(dd>(b.rage?440:340)*AS.range)continue;
      var bsp=Math.hypot(bu3.vx,bu3.vy)||1;
      if((-ddx*bu3.vx-ddy*bu3.vy)/dd<0.25*bsp)continue;
      if(dd<td2){td2=dd;threat=bu3;}
    }
    for(var rc2=0;rc2<G.arena.reds.length;rc2++){
      var rd2=G.arena.reds[rc2];
      if(rd2.side===b.i||rd2.px==null)continue;
      if(!(rd2.det>0)&&!b.rage)continue;
      var rd2d=Math.hypot(rd2.px-b.x,rd2.py-b.y);
      if(rd2d<(b.rage?300:220)*AS.range&&rd2d<td2){
        td2=rd2d;
        threat={x:rd2.px,y:rd2.py,vx:Math.cos(rd2.ang)*260,vy:Math.sin(rd2.ang)*260,isRed:1};
      }
    }
    if((b.st.sn||0)>0&&foe&&foe.skill==='charge'){
      var cph=foe.st.phase;
      var fdx=foe.x-b.x,fdy=foe.y-b.y,fd=Math.hypot(fdx,fdy)||1;
      var tvx=0,tvy=0;
      if(cph==='dash'){tvx=foe.vx;tvy=foe.vy;}
      else if(cph==='wind'){tvx=fdx/fd*420;tvy=fdy/fd*420;}
      if(tvx||tvy){
        var csp=Math.hypot(tvx,tvy)||1;
        var closing=(-fdx*tvx-fdy*tvy)/fd;
        if(closing>0.30*csp&&fd<(b.rage?430:350)*AS.range&&fd<td2){
          td2=fd;threat={x:foe.x,y:foe.y,vx:tvx,vy:tvy,isFoe:1};
        }
      }
    }
    if(threat){
      var bvx=threat.vx,bvy=threat.vy,bl2=Math.hypot(bvx,bvy)||1;
      var nx=-bvy/bl2,ny=bvx/bl2;
      var lead=0.34;
      var fx=threat.x+bvx*lead,fy=threat.y+bvy*lead;
      var d1=Math.hypot(b.x+nx*46-fx,b.y+ny*46-fy);
      var d2=Math.hypot(b.x-nx*46-fx,b.y-ny*46-fy);
      var wx=(d1>d2?nx:-nx),wy=(d1>d2?ny:-ny);
      var curD=Math.atan2(b.vy,b.vx);
      var wantD=Math.atan2(wy,wx);
      var dfD=((wantD-curD+Math.PI*3)%(Math.PI*2))-Math.PI;
      var spD=Math.hypot(b.vx,b.vy)||1;
      curD+=dfD*Math.min(0.85,dodge*(b.rage?2.6:1.5)*dt*9);
      b.vx=Math.cos(curD)*spD;b.vy=Math.sin(curD)*spD;
      b.st.snDodgeT=0.35;
    }
    if(G.arena.kilCuts&&G.arena.kilCuts.length&&(b.rage||(b.st.sn||0)>0)){
      var kc=null,kRel=0,kBest=1e9;
      for(var kci=0;kci<G.arena.kilCuts.length;kci++){
        var kcc=G.arena.kilCuts[kci];
        if(kcc.side===b.i||kcc.hit)continue;
        if(kcc.age>=kcc.delay)continue;
        var nx2=Math.cos(kcc.ang||0),ny2=Math.sin(kcc.ang||0);
        var rel2=(b.x-kcc.x)*nx2+(b.y-kcc.y)*ny2;
        var ad2=Math.abs(rel2);
        if(ad2>kcc.w*0.5+b.r+30*AS.range)continue;
        if(ad2<kBest){kBest=ad2;kc=kcc;kRel=rel2;nx2=nx2;ny2=ny2;}
      }
      if(kc){
        var sg2b=kRel>=0?1:-1;
        var curD2=Math.atan2(b.vy,b.vx);
        var wantD2=Math.atan2(ny2*sg2b,nx2*sg2b);
        var dfD2=((wantD2-curD2+Math.PI*3)%(Math.PI*2))-Math.PI;
        var spD2=Math.hypot(b.vx,b.vy)||1;
        curD2+=dfD2*Math.min(0.98,dodge*(b.rage?4.6:3.0)*dt*9);
        b.vx=Math.cos(curD2)*spD2;b.vy=Math.sin(curD2)*spD2;
        b.st.snDodgeT=0.35;
      }
    }
    if(b.st.snDodgeT>0)b.st.snDodgeT-=dt;
    if(b.rage){
      var inf2=SPECIES_INTEL[foe.skill];
      if(inf2&&inf2.pull){
        var ex2=b.x-foe.x,ey2=b.y-foe.y,ed2=Math.hypot(ex2,ey2)||1;
        var bhSafe=Math.max(60,(sg2.bhPullRange==null?380:sg2.bhPullRange))*AS.range*1.15*1.05;
        var safe=Math.max((sg2.snEvade==null?480:sg2.snEvade)*AS.range,bhSafe);
        if(ed2<safe){
          var curE=Math.atan2(b.vy,b.vx);
          var awayE=Math.atan2(ey2,ex2);
          var dfE=((awayE-curE+Math.PI*3)%(Math.PI*2))-Math.PI;
          var spE=Math.hypot(b.vx,b.vy)||1;
          curE+=dfE*Math.min(0.9,(1-ed2/safe)*dt*7);
          b.vx=Math.cos(curE)*spE;b.vy=Math.sin(curE)*spE;
          var pk=(1-ed2/safe);
          b.vx+=ex2/ed2*spE*pk*dt*5.0;
          b.vy+=ey2/ed2*spE*pk*dt*5.0;
          if(ed2<safe*0.62)popText(b.x,b.y-b.r-30,'脱离引力','#4affd0');
        }
      }
    }
  }
  if(b.skill==='conductor'&&(b.st.phase==='approach'||b.st.phase==='lay'||b.st.phase==='extend')&&!dashing){
    var gC=CFG.arena.global;
    var follow=b.stats.moveSpeed*0.38*AS.spd*dt;
    var dcx=foe.x-b.st.gx,dcy=foe.y-b.st.gy,dl2=Math.hypot(dcx,dcy)||1;
    if(dl2>0.5){
      var fs2=Math.min(follow,dl2);
      b.st.gx=clamp(b.st.gx+dcx/dl2*fs2,10,ARENA_W-10);
      b.st.gy=clamp(b.st.gy+dcy/dl2*fs2,10,ARENA_H-10);
    }
    var tx2,ty2;
    if(b.st.phase==='approach'){ tx2=b.st.sx; ty2=b.st.sy; }
    else if(b.st.phase==='extend'){ tx2=b.st.ex; ty2=b.st.ey; }
    else {
      var segMax2=Math.max(4,Math.round((gC.railSeg||18)*(b.rage?1.5:1)));
      var N2=Math.max(4,Math.round(gC.railSides||10));
      var prog=clamp(b.st.segI/Math.max(1,segMax2-1),0,1);
      var rOut=Math.min(ARENA_W,ARENA_H)*(Math.min(ARENA_W,ARENA_H)<400?0.30:0.38);
      var rIn=Math.max(70,96*AS.r);
      var R2=rOut+(rIn-rOut)*prog;
      var a2=b.st.ang0+b.st.segI*(Math.PI*2/N2);
      tx2=clamp(b.st.gx+Math.cos(a2)*R2,8,ARENA_W-8);
      ty2=clamp(b.st.gy+Math.sin(a2)*R2,8,ARENA_H-8);
    }
    var ox2=tx2-b.x,oy2=ty2-b.y,od2=Math.hypot(ox2,oy2)||1;
    var sp2=Math.hypot(b.vx,b.vy)||1;
    var blend2=Math.min(1,dt*10);
    b.vx=b.vx+(ox2/od2*sp2-b.vx)*blend2;
    b.vy=b.vy+(oy2/od2*sp2-b.vy)*blend2;
  }
  if(b.skill==='glitch')glitchMove(b,foe,dt);
  if(b.skill==='grave'){
    if((b.st.graveS3T||0)>0){
      var gsp3=(b.stats.moveSpeed||150)*AS.spd*2.4;
      b.x+=b.st.graveS3Dx*gsp3*dt;b.y+=b.st.graveS3Dy*gsp3*dt;
    }
    if((b.st.graveS5Go||0)>0){
      var gsp5=(b.stats.moveSpeed||150)*AS.spd*3.0;
      b.x+=b.st.graveS5Dx*gsp5*dt;b.y+=b.st.graveS5Dy*gsp5*dt;
    }
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
}
function glitchMove(b,foe,dt){
  var g=CFG.arena.global,st=b.st;
  var per=Math.max(0.3,(g.errModeT==null?1.6:g.errModeT))*(b.rage?0.68:1);
  if(st.grn>0){
    st.grn-=dt;
    if(st.grn<=0){st.grn=0;st.grnStep=0;st.grnN=0;
      popText(b.x,b.y-b.r-30,'\u6570\u5217\u7ec8\u6b62','#ff3b6b');}
  }
  st.glT-=dt;
  if(st.glT<=0){
    st.glT=rnd(per*0.7,per*1.35);
    var r=Math.random();
    if(b.rage){
      st.gl=(r<0.62)?'tp':((r<0.74)?'normal':((r<0.84)?'spin':((r<0.92)?'still':((r<0.97)?'grav':'buoy'))));
    }else{
      st.gl=(r<0.30)?'normal':((r<0.48)?'tp':((r<0.62)?'still':((r<0.78)?'spin':((r<0.90)?'grav':'buoy'))));
    }
    st.glV=0;st.glSpin=0;
    if(b.rage&&st.grn<=0&&Math.random()<clamp(g.errGreenRate==null?0.08:g.errGreenRate,0,1)){
      st.grn=Math.max(1,(g.errGreenDur==null?4.5:g.errGreenDur));
      st.grnStep=0;st.grnN=1;
      popText(b.x,b.y-b.r-44,'\u83f2\u6ce2\u90a3\u5951\u5f62\u6001','#5cff9d',true);
      spark(b.x,b.y,'#5cff9d',30,280);
    }
    if(st.gl==='tp'){glitchTeleport(b,foe);}
    else if(st.gl==='spin'){st.glSpin=(Math.random()<0.5?-1:1)*rnd(3.5,7.5);
      popText(b.x,b.y-b.r-14,'\u65cb\u8f6c','#ff8a3d');}
    else if(st.gl==='still')popText(b.x,b.y-b.r-14,'\u9759\u6b62','#9aa7b8');
    else if(st.gl==='grav')popText(b.x,b.y-b.r-14,'\u91cd\u529b','#74c0fc');
    else if(st.gl==='buoy')popText(b.x,b.y-b.r-14,'\u6d6e\u529b','#7cff8a');
  }
  if(st.gl==='still'){
    var k2=Math.pow(0.015,dt*60);b.vx*=k2;b.vy*=k2;
  }else if(st.gl==='grav'){
    b.vy+=560*AS.spd*dt;
  }else if(st.gl==='buoy'){
    b.vy-=560*AS.spd*dt;
  }else if(st.gl==='spin'){
    var sa2=st.glSpin*dt,ca2=Math.cos(sa2),sa3=Math.sin(sa2);
    var vX=b.vx,vY=b.vy;
    b.vx=vX*ca2-vY*sa3;b.vy=vX*sa3+vY*ca2;
  }else if(st.gl==='tp'){
    st.glV-=dt;
    if(st.glV<=0){st.glV=(b.rage?0.20:0.50);glitchTeleport(b,foe);}
  }
  var vv=Math.hypot(b.vx,b.vy),mx2=b.stats.moveSpeed*AS.spd*3.4;
  if(vv>mx2){b.vx=b.vx/vv*mx2;b.vy=b.vy/vv*mx2;}
}
function glitchTeleport(b,foe){
  var nx,ny;
  if(Math.random()<(b.rage?0.82:0.55)){
    var aa=rnd(0,6.283),dd=rnd(b.rage?46:70,(b.rage?104:150))*AS.range;
    nx=foe.x+Math.cos(aa)*dd;ny=foe.y+Math.sin(aa)*dd;
  }else{
    nx=rnd(0,ARENA_W);ny=rnd(0,ARENA_H);
  }
  nx=clamp(nx,b.r+4,ARENA_W-b.r-4);ny=clamp(ny,b.r+4,ARENA_H-b.r-4);
  spark(b.x,b.y,b.color,14,180);
  b.x=nx;b.y=ny;
  spark(b.x,b.y,'#ff3b6b',16,200);
  popText(b.x,b.y-b.r-14,'\u77ac\u79fb','#ff3b6b');
}
var WD_HEAVY={charge:1,iaido:1,grave:1,warden:1,leech:1,conductor:1,pulsar:1,blackhole:1,pulse:1,katana:1};
function wdDensity(b){
  var g=CFG.arena.global;
  var mx=clamp(g.wdDensMax==null?0.42:g.wdDensMax,0,0.9);
  return mx*(1-clamp(b.hp/Math.max(1,b.maxHp),0,1));
}
function wdImpactMul(b){
  if(b.skill!=='whitedwarf')return 1;
  return clamp(CFG.arena.global.wdImpact==null?1.6:CFG.arena.global.wdImpact,0.5,4);
}
function wdRollForm(b){return Math.random()<0.5?'pulsar':'blackhole';}
function wdWreckAbsorb(b,dmg,src){
  if(!b||b.skill!=='whitedwarf'||!(b.st.wdWreck||0)||!(dmg>0))return;
  var g=CFG.arena.global;
  var add=(dmg/Math.max(1,b.maxHp))*clamp(g.wdGainTake==null?1.9:g.wdGainTake,0,8);
  var before=b.st.wdCh||0;
  b.st.wdCh=clamp(before+add,0,1);
  b.hp=1;
  if(Math.random()<0.30)spark(b.x+rnd(-b.r,b.r),b.y+rnd(-b.r,b.r),'#dff0ff',1,90);
  if(Math.floor(b.st.wdCh*4)>Math.floor(before*4))
    popText(b.x,b.y-b.r-30,'坍缩能量 '+Math.round(b.st.wdCh*100)+'%','#dff0ff',true);
  if(b.st.wdCh>=1&&!(b.st.wdTrans||b.st.wdDone)){
    if(!b.st.wdLock)b.st.wdLock=wdRollForm(b);
    wdBeginCollapse(b,b.st.wdLock);
  }
}
function wdAddCharge(b,dmg){
  if(!b||!(b.st.wdWreck||0))return;
  if(!b||b.skill!=='whitedwarf'||!(dmg>0))return;
  var g=CFG.arena.global;
  var add=(dmg/Math.max(1,b.maxHp))*(g.wdGain==null?0.45:g.wdGain);
  b.st.wdCh=clamp((b.st.wdCh||0)+add,0,1);
  if(b.st.wdCh>=1&&!(b.st.wdTrans||b.st.wdDone||b.st.wdWreck))wdBeginCollapse(b,b.st.wdLock||b.st.wdForm);
}
function wdAddChargeTaken(b,dmg){
  if(!b||b.skill!=='whitedwarf'||!(dmg>0))return;
  if(!(b.st.wdWreck||0))return;
  var g=CFG.arena.global;
  var add=(dmg/Math.max(1,b.maxHp))*(g.wdGainTake==null?1.9:g.wdGainTake);
  b.st.wdCh=clamp((b.st.wdCh||0)+add,0,1);

function arenaStep(dt){
  var A=G.arena,g=globObj(G.mode);

    if(wzcb&&wzcb.skill==='binary'&&wzcb.st.bin&&wzcb.st.bin.trans&&!A.cine&&!A.rageQ.length)binDoFinal(wzcb);
  }
  if(typeof rivalTick==='function')rivalTick(A);

    if(typeof nukeTick==='function')nukeTick(b,dt);
    if(typeof veteranTick==='function')veteranTick(b,dt);
    var foe=arenaPickFoe(i,b.x,b.y)||arenaOneFoeBall(i,b.x,b.y);
    if(foe&&!foe.isGhost){
      var lostNow=(b.lost||0)>0;
      if(!lostNow&&nebEvadeAim(foe))lostNow=true;
      if(lostNow){
        var loA=rnd(0,6.283),loR=rnd(70,150)*AS.range;
        var ghost={};
        for(var gk in foe)ghost[gk]=foe[gk];
        ghost.isGhost=1;ghost.dead=false;
        ghost.x=clamp(foe.x+Math.cos(loA)*loR,b.r,ARENA_W-b.r);
        ghost.y=clamp(foe.y+Math.sin(loA)*loR,b.r,ARENA_H-b.r);
        if(!ghost.st)ghost.st={};
        foe=ghost;
      }
    }
    if(!foe){
      if(!A.over){var al=arenaAliveSides();
        A.over=true;A.winner=(al.length===1)?al[0]:(al.length?al[0]:-1);}

    bhRageHeal(b);

    tickKarmaDeck(b,dt);
    arenaAttack(b,foe,dt);
    arenaMove(b,foe,dt);
    var fr=Math.pow(g.friction,dt*60);
    b.vx*=fr;b.vy*=fr;
    b.r=Math.max(5,b.stats.radius*AS.r);
    var mpWall=false;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*g.wallBounce;mpWall=true;}
    if(b.x>ARENA_W-b.r){b.x=ARENA_W-b.r;b.vx=-Math.abs(b.vx)*g.wallBounce;mpWall=true;}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*g.wallBounce;mpWall=true;}
    if(b.y>ARENA_H-b.r){b.y=ARENA_H-b.r;b.vy=-Math.abs(b.vy)*g.wallBounce;mpWall=true;}

    if(b.immune>0)b.immune-=dt;
    if(b.st.pflash>0)b.st.pflash-=dt;

function bhLensMap(px,py,L){

  if(beta<L.cap)return 0;
  var e2=L.thE*L.thE;
  var th=(beta+Math.sqrt(beta*beta+4*e2))*0.5;
  var k=th/beta;
  L._ox=L.x+dx*k; L._oy=L.y+dy*k;
  return k;
}

function bhLensLine(x0,y0,x1,y1,L){

  while(t<=len+0.001){
    var rx=x0+ux*t, ry=y0+uy*t;
    var st=BASE;
    for(var q=0;q<L.length;q++){
      var qdx=rx-L[q].x,qdy=ry-L[q].y;
      var qd=Math.sqrt(qdx*qdx+qdy*qdy);
      if(qd<L[q].fine){
        var s2=Math.max(FINE,L[q].thE*0.09);
        if(s2<st)st=s2;

    var px=rx,py=ry,kk=1,dead=false;

    }
    t+=st;
  }
  if(pen)ctx.stroke();

function katPushToWall(b,foe){

function applyVertBias(b,bias){

  var ang=Math.atan2(b.vy,b.vx);

  var diff=((target-ang+Math.PI*3)%(Math.PI*2))-Math.PI;

  b.vx=Math.cos(ang)*s;b.vy=Math.sin(ang)*s;

function breakerStep(dt){
  var B=G.breaker,g=CFG.breaker.global;
  if(B.over){updateFX(dt);return;}
  B.t+=dt;
  for(var i=0;i<2;i++){
    var S=B.sides[i];
    var box=S.box,spd=g.ballSpeed*S.cfg.spdMul;
    for(var bi=S.balls.length-1;bi>=0;bi--){
      var b=S.balls[bi];
      b.vy+=g.gravity*dt;
      var isDer=(S.spec.math==='deriv');
      if(isDer&&(S.cfg.grav||0)>0)b.vy+=(S.cfg.grav||0)*dt;
      var v=Math.hypot(b.vx,b.vy);
      if(v<1){b.vx=0;b.vy=spd;v=spd;}
      var nv=lerp(v,spd,Math.min(1,isDer?dt*0.9:dt*4));
      if(isDer)nv=clamp(nv,spd*0.45,spd*1.95);
      b.vx=b.vx/v*nv;b.vy=b.vy/v*nv;
      var minVy=0.35*nv;
      if(Math.abs(b.vy)<minVy){
        b.vy=(b.vy>=0?1:-1)*minVy;
        var s2=Math.hypot(b.vx,b.vy)||1;b.vx=b.vx/s2*nv;b.vy=b.vy/s2*nv;
      }
      if(b.glStall>0){b.glStall-=dt;b.vx=0;b.vy=0;}
      var dist=Math.hypot(b.vx,b.vy)*dt;
      var steps=Math.max(1,Math.ceil(dist/3));
      var sdt=dt/steps,moved=0;
      for(var s3=0;s3<steps;s3++){
        b.x+=b.vx*sdt;b.y+=b.vy*sdt;
        if(b.x-b.r<box.x){b.x=box.x+b.r;b.vx=Math.abs(b.vx);
          b.pierceLeft=S.cfg.pierce;moved=1;applyVertBias(b,g.vertBias*0.5);}
        if(b.x+b.r>box.x+box.w){b.x=box.x+box.w-b.r;b.vx=-Math.abs(b.vx);
          b.pierceLeft=S.cfg.pierce;moved=1;applyVertBias(b,g.vertBias*0.5);}
        if(b.y-b.r<B.topY){b.y=B.topY+b.r;b.vy=Math.abs(b.vy);
          b.pierceLeft=S.cfg.pierce;moved=1;applyVertBias(b,g.vertBias*0.5);}
        if(hitLayer(S,b)){S.hits++;b.stuck=0;moved=1;}
        if(b.y+b.r>=B.goalY&&!B.over){
          B.over=true;B.winner=i;
          spark(b.x,B.goalY,'#ffffff',40,300);
          popText(box.x+box.w/2,B.goalY-26,'突破！','#7cff8a',true);
          break;
        }
      }
      if(!moved){b.stuck+=dt;
        if(b.stuck>4){b.vx+=rnd(-0.5,0.5)*spd;b.vy=rnd(0.2,0.8)*spd;b.stuck=0;}}
    }
  }
  for(var f=0;f<2;f++){var LS=B.sides[f];
    for(var lk=0;lk<LS.layers.length;lk++)if(LS.layers[lk].hitFlash>0)LS.layers[lk].hitFlash-=dt;}
  if(B.glitchFx){
    for(var gf=B.glitchFx.length-1;gf>=0;gf--){
      B.glitchFx[gf].age+=dt;
      if(B.glitchFx[gf].age>=B.glitchFx[gf].life)B.glitchFx.splice(gf,1);
    }
  }
  if(!B.over&&g.timeout>0&&B.t>=g.timeout){
    B.over=true;
    var ra=remain(0),rb=remain(1);
    B.winner=(ra===rb)?-1:((ra<rb)?0:1);
  }
  updateFX(dt);
}
