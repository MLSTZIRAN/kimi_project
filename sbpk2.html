var FIB=[1,1,2,3,5,8,13,21];
function mathDmg(S,b,la,dmg,crit){
  var g=CFG.breaker.global, m=S.spec.math;
  if(!m)return dmg;
  var base=g.brickHP||1, spd0=g.ballSpeed*(S.cfg.spdMul||1)||1;
  switch(m){
    case 'fib':{
      var fi=Math.min(b.broken||0,FIB.length-1);
      return dmg*(1+(FIB[fi]-1)*0.11);
    }
    case 'sqrt':{
      return dmg*Math.sqrt(Math.max(1,la.maxHp/base));
    }
    case 'square':{
      var v=Math.hypot(b.vx,b.vy)||spd0;
      var k=clamp(v/spd0,0.5,1.8);
      return dmg*k*k;
    }
    case 'fact':{
      var n=Math.min(b.broken||0,5);
      var f=1;for(var q=2;q<=n;q++)f*=q;
      return dmg*(1+f/120*1.5);
    }
    case 'power':{
      var ratio=clamp(la.hp/la.maxHp,0,1);
      return dmg*(1+1.8*(1-ratio)*(1-ratio));
    }
    case 'deriv':{
      var v2=Math.hypot(b.vx,b.vy)||spd0;
      return dmg*clamp(v2/spd0,0.45,2.1);
    }
    case 'set':{
      return dmg*(1+0.16*Math.max(0,S.balls.length-1));
    }
  }
  return dmg;
}
function mathSetSplash(S,la,dmg){

function mathSquareBoost(S,b){

function hitLayer(S,b){
  var g=CFG.breaker.global;

  for(var i=0;i<L.length;i++){
    var la=L[i];

      if(b.glStall>0)continue;

      if(G.breaker.glitchFx)G.breaker.glitchFx.push({x:la.x,y:la.y,w:la.w,h:la.h,age:0,life:0.42});
      continue;
    }
    var dmg=g.ballDamage*S.cfg.dmgMul;
    var crit=Math.random()<S.cfg.crit;

    popText(px,b.y-6,Math.round(dmg),crit?'#ffe14d':'rgba(255,255,255,.85)',crit);
    if(la.hp<=0){
      la.alive=false;S.broken++;b.broken++;

        }
      }
      popText(S.box.x+S.box.w/2,la.y+la.h/2,'破层','#ffe14d',true);
      if(S.cfg.splitEvery>0&&b.broken%S.cfg.splitEvery===0&&S.balls.length<g.maxBalls){
        var spd=g.ballSpeed*S.cfg.spdMul;
        var a=(fromTop?Math.PI/2:-Math.PI/2)+rnd(-0.8,0.8);
        S.balls.push({x:clamp(b.x,S.box.x+10,S.box.x+S.box.w-10),y:b.y,
          vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:S.cfg.radius,
          pierceLeft:S.cfg.pierce,broken:0,color:S.color,side:S.i,stuck:0});
        popText(b.x,b.y-18,'分裂','#b56bff');

    }
    b.pierceLeft=S.cfg.pierce;
    b.vy=-b.vy;

      var a2=Math.atan2(b.vy,b.vx)+rnd(-1,1)*g.jitter*0.35;

    }

    return true;
  }
  return false;

function camStep(){

  var H=(G.mode==='arena'||G.mode==='melee')?ARENA_H:G.breakerH;
  var live=focusIsFs()&&focusBall();
  if(!live){
    CAM.tz=1;
    CAM.z+=(1-CAM.z)*0.14;
    CAM.x+=((W*0.5)-CAM.x)*0.14;
    CAM.y+=((H*0.5)-CAM.y)*0.14;
    if(Math.abs(CAM.z-1)<0.004)CAM.z=1;
    CAM.init=0;
    return;
  }
  var p=focusPoint(live)||{x:live.x,y:live.y};
  var tz=clamp(CAM.tz,1.05,3.5);
  if(!CAM.init){CAM.x=p.x;CAM.y=p.y;CAM.z=1;CAM.init=1;}
  CAM.z+= (tz-CAM.z)*0.10;

  CAM.y+= (p.y-CAM.y)*0.22;

var SCR={shake:0,shakeT:0,shakeD:0,glitch:0,glitchT:0,glitchD:0,glitchI:1,
         black:0,blackT:0,blackD:0,gk:'',gv:null,gk2:'',gv2:null,
         cdS:0,cdK:0};
function scrMode(){var g=CFG.arena.global;return (g.scrFxMode==null)?2:(g.scrFxMode|0);}
function scrMul(){var g=CFG.arena.global;return clamp(g.scrShake==null?1:g.scrShake,0,2);}
function scrShake(amp,dur){

function scrBlack(dur){

  if(SCR.glitchT>0){SCR.glitchT-=dt;if(SCR.glitchT<=0)SCR.glitchT=0;}

function drawScreenFx(){
  var m=scrMode();if(m<=0)return;
  var W=(G.mode==='arena'||G.mode==='melee')?ARENA_W:BREAK_W;
  var H=(G.mode==='arena'||G.mode==='melee')?ARENA_H:G.breakerH;
  if(m>=2&&SCR.glitchT>0){
    var gp=1-SCR.glitchT/SCR.glitchD, gk=1-gp;

function render(){

function makeSlider(it,getVal,apply){
  var min=it.min,max=it.max,step=it.step||0;
  var sl=el('div','sl');
  sl.appendChild(el('div','trk'));
  var fil=sl.appendChild(el('div','fil'));
  var thb=sl.appendChild(el('div','thb'));
  var bub=sl.appendChild(el('div','val'));
  function qz(v){
    v=clamp(v,min,max);
    if(step>0)v=Math.round((v-min)/step)*step+min;
    return clamp(v,min,max);
  }
  function fmt(v){return (it.isPct?Math.round(v*1000)/10:Math.round(v*1000)/1000).toString();}
  function paint(v){
    var p=clamp((v-min)/(max-min||1),0,1);
    fil.style.width=(p*100)+'%';
    thb.style.left=(p*100)+'%';
    bub.style.left=(p*100)+'%';
    bub.textContent=fmt(v);
  }
  paint(getVal());
  var drag=false,nudge=null,tm=0;
  function localVal(cx){
    var r=sl.getBoundingClientRect();
    return qz(min+clamp((cx-r.left)/(r.width||1),0,1)*(max-min));
  }
  function stop(){
    drag=false;sl.classList.remove('hot');
    if(nudge){clearInterval(nudge);nudge=null;}
    if(tm){clearTimeout(tm);tm=0;}
  }
  sl.addEventListener('pointerdown',function(e){
    var r=sl.getBoundingClientRect();
    var cur=getVal();
    var tx=r.left+clamp((cur-min)/(max-min||1),0,1)*r.width;
    if(Math.abs(e.clientX-tx)<=18){
      drag=true;sl.classList.add('hot');
      try{sl.setPointerCapture(e.pointerId);}catch(_){}
      apply(localVal(e.clientX));paint(getVal());
    }else{
      var tgt=localVal(e.clientX),lim=Math.max(step||0,(max-min)*0.04);
      sl.classList.add('hot');
      nudge=setInterval(function(){
        var c=getVal(),d=tgt-c;
        if(Math.abs(d)<1e-9){stop();return;}
        apply(qz(c+clamp(d,-lim,lim)));paint(getVal());
      },55);
      tm=setTimeout(stop,900);
    }
    e.preventDefault();
  });
  sl.addEventListener('pointermove',function(e){
    if(!drag)return;
    apply(localVal(e.clientX));paint(getVal());
    e.preventDefault();
  });
  sl.addEventListener('pointerup',stop);
  sl.addEventListener('pointercancel',stop);
  sl.addEventListener('lostpointercapture',stop);
  return {node:sl,paint:paint};
}

function cycleRageHP(){
  var cur=CFG.arena.global.rageHP,i=RAGE_STEPS.indexOf(cur);
  if(i<0){
    var best=0,bd=9;
    for(var k=0;k<RAGE_STEPS.length;k++){var d=Math.abs(RAGE_STEPS[k]-cur);if(d<bd){bd=d;best=k;}}
    i=best;
  }
  CFG.arena.global.rageHP=RAGE_STEPS[(i+1)%RAGE_STEPS.length];
  if(!CFG.arena.global.rage)CFG.arena.global.rage=1;
  saveCfg();resetMatch();renderTopbar();buildSettingsIfOpen();updateHUD();

var FSZ={z:1,x:0,y:0};
var FSZ_MIN=0.5,FSZ_MAX=4;
function fsZoomTxt(){
  var t=$('fsZoomTxt');if(t)t.textContent=Math.round(FSZ.z*100)+'%';
}
function fsApplyZoom(){
  var st=$('stageEl');if(!st)return;
  st.style.setProperty('--fsz',FSZ.z);
  st.style.setProperty('--fspx',FSZ.x+'px');
  st.style.setProperty('--fspy',FSZ.y+'px');
  fsZoomTxt();
}
function fsClampZoom(){
  FSZ.z=clamp(FSZ.z,FSZ_MIN,FSZ_MAX);
  var st=$('stageEl'),cv=$('cv');
  if(st&&cv){
    var w=st.clientWidth||1,h=st.clientHeight||1;
    var mx=Math.max(0,(w*FSZ.z-w)*0.5),my=Math.max(0,(h*FSZ.z-h)*0.5);
    if(FSZ.z<=1.001){FSZ.x=0;FSZ.y=0;}
    else{FSZ.x=clamp(FSZ.x,-mx,mx);FSZ.y=clamp(FSZ.y,-my,my);}
  }
  fsApplyZoom();
}
function fsZoomBy(f,ax,ay){
  var old=FSZ.z;
  FSZ.z=clamp(FSZ.z*f,FSZ_MIN,FSZ_MAX);
  if(ax!=null){
    var st=$('stageEl');if(!st){fsClampZoom();return;}
    var w=st.clientWidth||1,h=st.clientHeight||1;
    var px=(ax-w*0.5),py=(ay-h*0.5);
    var k=FSZ.z/old;
    FSZ.x=px-(px-FSZ.x)*k;
    FSZ.y=py-(py-FSZ.y)*k;
  }
  fsClampZoom();
}
function fsZoomReset(){FSZ.z=1;FSZ.x=0;FSZ.y=0;fsClampZoom();}
function bindFsZoom(){
  var cv=$('cv');if(!cv)return;
  var out=$('fsZoomOut'),inb=$('fsZoomIn'),rs=$('fsZoomReset');
  if(out)out.onclick=function(e){e.preventDefault();e.stopPropagation();fsZoomBy(1/1.25);};
  if(inb)inb.onclick=function(e){e.preventDefault();e.stopPropagation();fsZoomBy(1.25);};
  if(rs)rs.onclick=function(e){e.preventDefault();e.stopPropagation();fsZoomReset();};
  cv.addEventListener('wheel',function(e){
    if(!fsActive())return;
    e.preventDefault();
    var st=$('stageEl');if(!st)return;
    var r=st.getBoundingClientRect();
    var f=Math.pow(1.0016,-e.deltaY);
    fsZoomBy(clamp(f,0.6,1.7),e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  var pts={},drag=null,pinch=null;
  function rel(e){var st=$('stageEl');var r=st.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  function pdist(){
    var ks=Object.keys(pts);if(ks.length<2)return 0;
    var a=pts[ks[0]],b=pts[ks[1]];
    return Math.hypot(a.x-b.x,a.y-b.y);
  }
  cv.addEventListener('pointerdown',function(e){
    if(!fsActive())return;
    pts[e.pointerId]=rel(e);
    if(Object.keys(pts).length===2){
      pinch={d:pdist()};drag=null;
    }else if(Object.keys(pts).length===1){
      drag={sx:FSZ.x,sy:FSZ.y,ox:rel(e).x,oy:rel(e).y};
      cv.classList.add('fsdrag');
    }
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
  });
  cv.addEventListener('pointermove',function(e){
    if(!fsActive()||!pts[e.pointerId])return;
    pts[e.pointerId]=rel(e);
    if(pinch&&Object.keys(pts).length>=2){
      var d=pdist();
      if(pinch.d>1&&d>1){
        var st=$('stageEl');var r=st.getBoundingClientRect();
        var ks=Object.keys(pts);
        var cxp=(pts[ks[0]].x+pts[ks[1]].x)*0.5,cyp=(pts[ks[0]].y+pts[ks[1]].y)*0.5;
        fsZoomBy(d/pinch.d,cxp,cyp);
        pinch.d=d;
      }
      return;
    }
    if(drag){
      FSZ.x=drag.sx+(rel(e).x-drag.ox);
      FSZ.y=drag.sy+(rel(e).y-drag.oy);
      fsClampZoom();
    }
  });
  function pend(e){
    delete pts[e.pointerId];
    if(Object.keys(pts).length<2)pinch=null;
    if(Object.keys(pts).length===0){drag=null;cv.classList.remove('fsdrag');}
  }
  cv.addEventListener('pointerup',pend);
  cv.addEventListener('pointercancel',pend);
  cv.addEventListener('pointerleave',pend);
}
