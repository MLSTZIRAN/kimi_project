<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>透镜侦探 · Liquid Detective</title>
<style>
:root {
  --c-bg: #1a1a2e;
  --c-bg-80: rgba(26,26,46,.8);
  --c-bg-90: rgba(26,26,46,.9);
  --c-border: rgba(110,200,255,.2);
  --c-border-strong: rgba(110,200,255,.3);
  --c-border-solid: rgba(110,200,255,.4);
  --c-accent: #6ec8ff;
  --c-accent-dim: #4a90a4;
  --c-text: #8ab4c7;
  --c-text-dim: #4a5a6a;
  --c-green: #4ade80;
  --c-gold: #fbbf24;
  --c-red: #ef4444;
  --c-hover: rgba(110,200,255,.1);
  --c-hover-light: rgba(110,200,255,.05);
  --font-mono: 'Courier New', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; user-select: none; }

/* ===== SVG 通用 ===== */
.clue-svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; color: var(--c-accent); flex-shrink: 0; }
.clue-svg.fill { fill: currentColor; stroke: none; }
.clue-svg.sm { width: 14px; height: 14px; stroke-width: 2; }

/* ===== Loading ===== */
#loader { position: fixed; inset: 0; background: var(--c-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
#loader.hidden { display: none; }
.loader-spinner { width: 56px; height: 56px; animation: spin 2s linear infinite; will-change: transform; }
.loader-spinner-circle { fill: none; stroke: var(--c-accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1, 200; stroke-dashoffset: 0; animation: dash 1.5s cubic-bezier(.4,0,.2,1) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dash {
  0%   { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
  50%  { stroke-dasharray: 90, 200; stroke-dashoffset: -35px; }
  100% { stroke-dasharray: 90, 200; stroke-dashoffset: -124px; }
}
.loader-text { margin-top: 22px; color: var(--c-accent); font-size: 14px; letter-spacing: 4px; }

/* ===== 菜单 ===== */
#menu { position: fixed; inset: 0; background: var(--c-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; transition: filter 1s ease-out; }
#menu.hidden { visibility: hidden; pointer-events: none; }
.game-title { font-size: 42px; color: var(--c-accent); letter-spacing: 8px; margin-bottom: 8px; text-shadow: 0 0 30px rgba(110,200,255,.3); }
.game-subtitle { font-size: 13px; color: var(--c-accent-dim); letter-spacing: 6px; margin-bottom: 30px; }

.menu-btn {
  padding: 14px 48px; margin: 8px; background: transparent;
  border: 1px solid var(--c-border-solid); color: var(--c-accent);
  font-size: 14px; letter-spacing: 3px; cursor: pointer;
  transition: all .3s; border-radius: 4px;
}
.menu-btn:hover { background: var(--c-hover); border-color: var(--c-accent); }
.menu-btn.sm { margin-top: 24px; padding: 8px 20px; font-size: 12px; opacity: .6; letter-spacing: 2px; }

.level-select {
  display: flex; gap: 12px; margin-top: 10px;
  flex-wrap: wrap; justify-content: center;
  max-width: 700px; max-height: 62vh; overflow-y: auto; padding: 4px;
  scrollbar-width: thin; scrollbar-color: rgba(110,200,255,.25) transparent;
}
.level-select::-webkit-scrollbar { width: 4px; }
.level-select::-webkit-scrollbar-thumb { background: rgba(110,200,255,.25); border-radius: 2px; }

.level-card {
  width: 88px; height: 108px;
  border: 1px solid var(--c-border); border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all .3s; position: relative; flex-shrink: 0;
}
.level-card:hover:not(.locked) { border-color: var(--c-accent); background: var(--c-hover-light); }
.level-card.locked { opacity: .3; cursor: not-allowed; }
.level-card.completed::after { content: "✓"; position: absolute; top: 8px; right: 8px; color: var(--c-green); font-size: 12px; }
.level-num { font-size: 24px; color: var(--c-accent); font-weight: bold; }
.level-name { font-size: 10.5px; color: var(--c-accent-dim); margin-top: 6px; text-align: center; padding: 0 4px; line-height: 1.3; }

/* ===== 游戏 ===== */
#game { position: fixed; inset: 0; visibility: hidden; pointer-events: none; transition: filter 1s ease-out; }
#game.active { visibility: visible; pointer-events: all; }
#menu.blur-in, #game.blur-in { filter: brightness(.3) contrast(.4) saturate(.15); }
.fake-scene { position: fixed; inset: 0; pointer-events: none; }

.hud { position: fixed; top: 0; left: 0; right: 0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 50; pointer-events: none; }
.hud-left, .hud-right { display: flex; align-items: center; gap: 16px; pointer-events: all; }
.hud-item, .hud-btn {
  background: var(--c-bg-80); border: 1px solid var(--c-border);
  padding: 8px 16px; border-radius: 4px; color: var(--c-accent);
  font-size: 12px; letter-spacing: 1px;
}
.hud-btn { cursor: pointer; transition: all .3s; }
.hud-btn:hover { border-color: var(--c-accent); background: var(--c-hover); }

.panel-overlay { position: fixed; inset: 0; background: rgba(10,10,20,.45); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .3s; }
.panel-overlay.active { opacity: 1; pointer-events: all; }

#clue-panel { position: fixed; right: -360px; top: 0; bottom: 0; width: 360px; background: rgba(26,26,46,.98); border-left: 1px solid var(--c-border); padding: 80px 24px 24px; transition: right .4s; z-index: 60; overflow-y: auto; }
#clue-panel.open { right: 0; }
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.panel-title { color: var(--c-accent); font-size: 16px; letter-spacing: 3px; }
.panel-close { color: var(--c-accent-dim); cursor: pointer; padding: 4px 8px; transition: color .3s; display: flex; align-items: center; }
.panel-close:hover { color: var(--c-accent); }
.panel-hint { color: var(--c-accent-dim); font-size: 11px; margin-bottom: 24px; letter-spacing: 1px; line-height: 1.6; }

.clue-slot { padding: 16px; border: 1px dashed rgba(110,200,255,.15); border-radius: 6px; margin-bottom: 12px; min-height: 60px; display: flex; align-items: center; gap: 12px; }
.clue-slot.found { border-style: solid; border-color: var(--c-border-strong); background: var(--c-hover-light); }
.clue-order { width: 28px; height: 28px; border-radius: 50%; background: rgba(110,200,255,.1); display: flex; align-items: center; justify-content: center; color: var(--c-accent-dim); font-size: 12px; font-weight: bold; flex-shrink: 0; }
.clue-slot.found .clue-order { background: var(--c-border-strong); color: var(--c-accent); }
.clue-icon { width: 36px; height: 36px; border-radius: 50%; background: rgba(110,200,255,.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.clue-text { color: var(--c-text); font-size: 12px; line-height: 1.6; }
.clue-slot:not(.found) .clue-text { color: var(--c-text-dim); }

/* ===== 密码面板 ===== */
.code-display {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: var(--c-bg-90); border: 1px solid var(--c-border-strong);
  border-radius: 8px; overflow: hidden; z-index: 50;
  transition: width .35s cubic-bezier(.4,0,.2,1), height .35s cubic-bezier(.4,0,.2,1), border-radius .35s cubic-bezier(.4,0,.2,1);
}
.code-display-inner { display: flex; gap: 8px; align-items: center; padding: 16px 20px; white-space: nowrap; transition: opacity .2s ease .1s, transform .3s cubic-bezier(.4,0,.2,1) .05s; }
.code-display.collapsed .code-display-inner { opacity: 0; transform: scale(.7); pointer-events: none; transition: opacity .15s ease, transform .2s cubic-bezier(.4,0,.2,1); }
.code-display.collapsed { width: 52px; height: 52px; border-radius: 26px; cursor: pointer; }
.code-expand-btn { position: absolute; inset: 0; background: transparent; border: none; color: var(--c-accent); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 3; }
.code-expand-btn .clue-svg { width: 22px; height: 22px; }
.code-display.collapsed .code-expand-btn { opacity: 1; pointer-events: all; transition: opacity .25s ease .1s; }
.code-inputs { display: flex; gap: 8px; }
.code-char {
  width: 44px; height: 52px;
  background: rgba(110,200,255,.05); border: 1px solid var(--c-border);
  border-radius: 4px; color: var(--c-accent);
  font-size: 24px; font-weight: bold; font-family: var(--font-mono);
  text-align: center; text-transform: uppercase; outline: none; caret-color: var(--c-accent); transition: all .2s;
}
.code-char:focus { border-color: var(--c-accent); background: rgba(110,200,255,.12); box-shadow: 0 0 12px rgba(110,200,255,.35); }
.code-char.filled { border-color: var(--c-accent); background: rgba(110,200,255,.15); text-shadow: 0 0 10px rgba(110,200,255,.5); }
.code-submit-btn {
  margin-left: 8px; padding: 12px 24px;
  background: rgba(110,200,255,.15); border: 1px solid var(--c-accent);
  color: var(--c-accent); border-radius: 4px; cursor: pointer;
  font-size: 13px; letter-spacing: 2px; white-space: nowrap; transition: all .2s;
}
.code-submit-btn:hover:not(:disabled) { background: rgba(110,200,255,.25); }
.code-submit-btn:disabled { opacity: .3; cursor: not-allowed; }
.code-toggle-btn { background: transparent; border: none; color: var(--c-accent); font-size: 16px; cursor: pointer; padding: 4px 6px; border-radius: 4px; line-height: 1; flex-shrink: 0; opacity: .7; transition: opacity .2s; }
.code-toggle-btn:hover { opacity: 1; }
@keyframes shake {
  0%, 100% { transform: translateX(-50%); }
  25%      { transform: translateX(calc(-50% - 6px)); }
  75%      { transform: translateX(calc(-50% + 6px)); }
}
.code-display.shake { animation: shake .4s; }

/* ===== 过场 ===== */
#pageVeil {
  position: fixed;
  left: var(--veil-x, 50%); top: var(--veil-y, 50%);
  width: 100vmax; height: 100vmax;
  pointer-events: none; visibility: hidden; z-index: 10000;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    #14223d 0%, #0a1220 40%, #05080f 76%,
    #1e3a6a 79%, #3a6aae 80%, #1e3a6a 81%, #020408 83%, #020408 100%);
  transform: translate(-50%, -50%) scale(.001);
  transform-origin: 50% 50%;
  opacity: 1;
  will-change: transform, opacity;
  transition: transform .3s cubic-bezier(.16,1,.3,1), opacity .3s ease;
}
#pageVeil.active { visibility: visible; }
#pageVeil.fade { opacity: 0; }

/* ===== 通关面板 ===== */
#victory {
  position: fixed; inset: 0; background: rgba(26,26,46,.95);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity .35s;
}
#victory.show { opacity: 1; pointer-events: all; }
#victory > * {
  opacity: 0; transform: translateY(26px);
  transition: opacity .5s ease, transform .55s cubic-bezier(.34,1.56,.64,1);
}
#victory.show > * { opacity: 1; transform: translateY(0); }
#victory.show > *:nth-child(1) { transition-delay: .08s; }
#victory.show > *:nth-child(2) { transition-delay: .2s; }
#victory.show > *:nth-child(3) { transition-delay: .32s; }
#victory.show > *:nth-child(4) { transition-delay: .4s; }
.victory-title { font-size: 36px; color: var(--c-green); letter-spacing: 6px; margin-bottom: 16px; text-shadow: 0 0 30px rgba(74,222,128,.4); }
.victory-stats { color: var(--c-text); font-size: 14px; margin-bottom: 40px; line-height: 2; text-align: center; }

/* ===== 结算 ===== */
#finale {
  position: fixed; inset: 0;
  background: radial-gradient(circle at 50% 30%, rgba(30,42,70,.98), rgba(12,12,22,.99));
  display: flex; align-items: center; justify-content: center;
  z-index: 250; opacity: 0; pointer-events: none;
  transition: opacity .4s ease;
  padding: 24px; overflow: hidden;
}
#finale.show { opacity: 1; pointer-events: all; }

.finale-ambient { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.finale-ambient::before {
  content: ''; position: absolute; top: 30%; left: 50%;
  width: 140vmax; height: 140vmax; margin: -70vmax 0 0 -70vmax;
  border-radius: 50%;
  background: repeating-radial-gradient(circle at center, transparent 0, transparent 60px, rgba(110,200,255,.025) 60px, rgba(110,200,255,.025) 61px);
  animation: ambientSpin 80s linear infinite;
  opacity: 0; transition: opacity 1.2s ease .2s;
}
#finale.show .finale-ambient::before { opacity: 1; }
@keyframes ambientSpin { to { transform: rotate(360deg); } }

.finale-inner {
  position: relative; max-width: 580px; width: 100%;
  max-height: calc(100vh - 48px); overflow-y: auto; text-align: center;
  display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  scrollbar-width: thin; scrollbar-color: rgba(110,200,255,.25) transparent;
}
.finale-inner::-webkit-scrollbar { width: 4px; }
.finale-inner::-webkit-scrollbar-thumb { background: rgba(110,200,255,.25); border-radius: 2px; }

/* ===== 徽章：SVG 刻度环 ===== */
.finale-badge {
  position: relative; width: 110px; height: 110px; margin-bottom: 24px;
  opacity: 0; transform: scale(.3) rotate(-120deg);
  transition: opacity .55s ease, transform .8s cubic-bezier(.34,1.56,.64,1);
}
#finale.show .finale-badge { opacity: 1; transform: scale(1) rotate(0deg); transition-delay: .1s; }
.badge-glow {
  position: absolute; inset: -16px; border-radius: 50%;
  background: radial-gradient(circle, rgba(74,222,128,.28), transparent 65%);
  filter: blur(6px);
  animation: badgeGlowPulse 2.6s ease-in-out infinite;
}
@keyframes badgeGlowPulse {
  0%, 100% { opacity: .6; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.08); }
}
/* SVG 刻度环：30 段等长刻度，沿切线方向排列 */
.badge-ring {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  color: var(--c-green);
  animation: badgeSpin 20s linear infinite;
  transform-origin: 50% 50%;
}
@keyframes badgeSpin { to { transform: rotate(360deg); } }

.badge-core {
  position: absolute; inset: 8px; border-radius: 50%;
  background: radial-gradient(circle, rgba(74,222,128,.25), rgba(74,222,128,.03));
  border: 2px solid var(--c-green);
  display: flex; align-items: center; justify-content: center;
  color: var(--c-green);
  box-shadow: 0 0 40px rgba(74,222,128,.4), inset 0 0 24px rgba(74,222,128,.15);
}
.badge-core .clue-svg { width: 42px; height: 42px; stroke-width: 2.4; }

.finale-title {
  font-size: 32px; color: #e8f4ff; letter-spacing: 8px; margin-bottom: 6px;
  text-shadow: 0 0 30px rgba(110,200,255,.45);
  opacity: 0; transform: translateY(20px);
  transition: opacity .6s ease, transform .7s cubic-bezier(.22,1,.36,1);
}
#finale.show .finale-title { opacity: 1; transform: translateY(0); transition-delay: .32s; }

.finale-scanner {
  width: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--c-green), transparent);
  box-shadow: 0 0 10px rgba(74,222,128,.7);
  margin: 6px 0 14px; opacity: 0;
}
#finale.show .finale-scanner { animation: scannerExpand .9s ease-out .5s forwards; }
@keyframes scannerExpand {
  0%   { width: 0; opacity: 0; }
  40%  { opacity: 1; }
  100% { width: 140px; opacity: .8; }
}

.finale-subtitle {
  font-size: 11px; color: var(--c-accent-dim); letter-spacing: 5px; margin-bottom: 28px;
  opacity: 0; transform: translateY(10px);
  transition: opacity .5s ease, transform .6s ease, color .4s;
}
#finale.show .finale-subtitle { opacity: 1; transform: translateY(0); transition-delay: .6s; }
.finale-subtitle.perfect {
  color: var(--c-gold);
  text-shadow: 0 0 16px rgba(251,191,36,.7);
  animation: perfectGlow 2s ease-in-out infinite;
}
@keyframes perfectGlow {
  0%, 100% { text-shadow: 0 0 16px rgba(251,191,36,.5); }
  50%      { text-shadow: 0 0 28px rgba(251,191,36,.9); }
}

.finale-summary { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
.finale-stat {
  background: rgba(110,200,255,.06);
  border: 1px solid var(--c-border);
  border-radius: 8px; padding: 14px 22px; min-width: 104px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  opacity: 0; transform: translateY(24px) scale(.94);
  transition: opacity .5s ease, transform .6s cubic-bezier(.34,1.56,.64,1), border-color .3s, background .3s;
}
#finale.show .finale-stat {
  opacity: 1; transform: translateY(0) scale(1);
  transition-delay: calc(.72s + var(--i, 0) * .08s);
}
.finale-stat:hover { border-color: rgba(110,200,255,.5); background: var(--c-hover); }
.finale-stat-num {
  font-size: 24px; color: var(--c-accent); font-weight: bold;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 12px rgba(110,200,255,.4);
}
.finale-stat-label { font-size: 11px; color: var(--c-accent-dim); letter-spacing: 1px; }

.finale-list {
  width: 100%; max-height: 32vh; overflow-y: auto;
  background: rgba(15,15,30,.55);
  border: 1px solid rgba(110,200,255,.14);
  border-radius: 8px; padding: 6px; margin-bottom: 22px;
  scrollbar-width: thin; scrollbar-color: rgba(110,200,255,.25) transparent;
}
.finale-list::-webkit-scrollbar { width: 4px; }
.finale-list::-webkit-scrollbar-thumb { background: rgba(110,200,255,.25); border-radius: 2px; }

.finale-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 4px;
  font-size: 12px; color: var(--c-text);
  border-bottom: 1px solid rgba(110,200,255,.06);
  opacity: 0; transform: translateX(30px);
  transition: opacity .45s ease, transform .55s cubic-bezier(.22,1,.36,1);
}
#finale.show .finale-row {
  opacity: 1; transform: translateX(0);
  transition-delay: calc(.98s + var(--i, 0) * .04s);
}
.finale-row:last-child { border-bottom: none; }
.row-name { color: #a8d8ff; letter-spacing: 1px; text-align: left; flex-shrink: 0; min-width: 84px; }
.row-meta { display: flex; gap: 14px; margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.row-time { color: var(--c-accent); min-width: 44px; text-align: right; }
.row-clues { color: var(--c-accent-dim); min-width: 30px; text-align: right; }
.row-clues.perfect { color: var(--c-gold); }

.mini-bar { flex: 1; height: 3px; background: rgba(110,200,255,.1); border-radius: 2px; overflow: hidden; min-width: 30px; max-width: 70px; }
.mini-fill {
  height: 100%; width: 0; border-radius: 2px;
  background: linear-gradient(90deg, rgba(110,200,255,.4), var(--c-accent));
  transition: width .7s cubic-bezier(.34,1.2,.64,1);
}
#finale.show .mini-fill {
  width: var(--pct, 0%);
  transition-delay: calc(1.18s + var(--i, 0) * .04s);
}
.mini-fill.perfect { background: linear-gradient(90deg, rgba(251,191,36,.5), var(--c-gold)); box-shadow: 0 0 6px rgba(251,191,36,.5); }

.finale-hint {
  color: var(--c-accent); font-size: 12px; letter-spacing: 4px; margin-bottom: 14px; text-align: center;
  opacity: 0; transform: translateY(20px);
  text-shadow: 0 0 12px rgba(110,200,255,.35);
  transition: opacity .5s ease, transform .6s cubic-bezier(.34,1.56,.64,1);
}
#finale.show .finale-hint { opacity: 1; transform: translateY(0); transition-delay: 1.4s; }

.finale-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.finale-actions .menu-btn {
  opacity: 0; transform: translateY(20px) scale(.9);
  transition: opacity .5s ease, transform .6s cubic-bezier(.34,1.56,.64,1);
}
#finale.show .finale-actions .menu-btn { opacity: 1; transform: translateY(0) scale(1); }
#finale.show .finale-actions .menu-btn:nth-child(1) { transition-delay: 1.5s; }
#finale.show .finale-actions .menu-btn:nth-child(2) { transition-delay: 1.6s; }

/* PERFECT 金色主题 */
#finale.perfect .badge-glow { background: radial-gradient(circle, rgba(251,191,36,.32), transparent 65%); }
#finale.perfect .badge-ring { color: var(--c-gold); }
#finale.perfect .badge-core {
  color: var(--c-gold); border-color: var(--c-gold);
  background: radial-gradient(circle, rgba(251,191,36,.28), rgba(251,191,36,.03));
  box-shadow: 0 0 48px rgba(251,191,36,.55), inset 0 0 24px rgba(251,191,36,.2);
}
#finale.perfect .finale-scanner { background: linear-gradient(90deg, transparent, var(--c-gold), transparent); box-shadow: 0 0 10px rgba(251,191,36,.7); }
#finale.perfect .finale-title { color: #fffbeb; text-shadow: 0 0 30px rgba(251,191,36,.5); }
#finale.perfect .finale-stat { border-color: rgba(251,191,36,.3); }
#finale.perfect .finale-stat:hover { border-color: rgba(251,191,36,.6); background: rgba(251,191,36,.08); }
#finale.perfect .finale-stat-num { color: var(--c-gold); text-shadow: 0 0 12px rgba(251,191,36,.45); }

/* ===== Toast ===== */
.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: var(--c-bg-90); border: 1px solid var(--c-border-strong);
  padding: 12px 28px; border-radius: 4px;
  color: var(--c-accent); font-size: 13px; letter-spacing: 1px;
  opacity: 0; transition: all .3s; z-index: 70; pointer-events: none;
  max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--c-red); color: var(--c-red); }

/* ===== 透镜 & 扫描线 ===== */
liquid-lens { position: fixed; inset: 0; height: 100vh; width: 100vw; touch-action: none; cursor: grab; }
liquid-lens:active { cursor: grabbing; }
#lensContent { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }

.scanline {
  position: fixed; inset: 0; pointer-events: none; z-index: 30;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(110,200,255,.015) 2px, rgba(110,200,255,.015) 4px);
}

/* ===== 响应式 ===== */
@media (max-width: 560px) {
  .code-char { width: 36px; height: 44px; font-size: 18px; }
  .code-inputs { gap: 5px; }
  .code-display-inner { padding: 10px 12px; }
  .code-submit-btn { margin-left: 6px; padding: 10px 12px; font-size: 12px; }
  .finale-title { font-size: 26px; letter-spacing: 5px; }
  .finale-stat { padding: 12px 16px; min-width: 88px; }
  .finale-stat-num { font-size: 20px; }
  .finale-badge { width: 92px; height: 92px; }
  .badge-core .clue-svg { width: 34px; height: 34px; }
}

@media (max-height: 520px) {
  .hud { padding: 8px 16px; }
  .hud-left, .hud-right { gap: 10px; }
  .hud-item, .hud-btn { padding: 6px 12px; font-size: 11px; }

  .code-display { bottom: 12px; }
  .code-display-inner { padding: 8px 12px; gap: 6px; }
  .code-char { width: 32px; height: 38px; font-size: 16px; }
  .code-inputs { gap: 4px; }
  .code-submit-btn { margin-left: 4px; padding: 8px 12px; font-size: 11px; letter-spacing: 1px; }
  .code-toggle-btn { padding: 2px 4px; font-size: 14px; }
  .code-display.collapsed { width: 44px; height: 44px; border-radius: 22px; }

  #clue-panel { width: 300px; padding: 56px 16px 16px; }
  .panel-title { font-size: 14px; }
  .panel-hint { margin-bottom: 12px; font-size: 10px; }
  .clue-slot { padding: 10px; min-height: 48px; margin-bottom: 8px; gap: 8px; }
  .clue-order { width: 24px; height: 24px; font-size: 11px; }
  .clue-icon { width: 30px; height: 30px; }
  .clue-svg { width: 15px; height: 15px; }
  .clue-text { font-size: 11px; }

  .game-title { font-size: 32px; letter-spacing: 6px; }
  .game-subtitle { font-size: 11px; letter-spacing: 4px; margin-bottom: 20px; }
  .level-select { gap: 8px; max-height: 50vh; max-width: 620px; }
  .level-card { width: 72px; height: 88px; }
  .level-num { font-size: 18px; }
  .level-name { font-size: 9.5px; margin-top: 4px; }
  .menu-btn { padding: 10px 32px; font-size: 12px; letter-spacing: 2px; }

  .toast { top: 50px; padding: 8px 20px; font-size: 12px; }

  .victory-title { font-size: 28px; letter-spacing: 4px; margin-bottom: 12px; }
  .victory-stats { font-size: 12px; margin-bottom: 24px; line-height: 1.7; }

  .finale-inner { max-width: 760px; padding: 12px; }
  .finale-badge { width: 64px; height: 64px; margin-bottom: 12px; }
  .badge-core { inset: 4px; }
  .badge-core .clue-svg { width: 26px; height: 26px; }
  .badge-glow { inset: -8px; filter: blur(4px); }
  .finale-title { font-size: 22px; letter-spacing: 4px; margin-bottom: 2px; }
  .finale-scanner { margin: 4px 0 8px; }
  .finale-subtitle { font-size: 10px; letter-spacing: 3px; margin-bottom: 14px; }
  .finale-summary { gap: 8px; margin-bottom: 12px; }
  .finale-stat { padding: 8px 14px; min-width: 84px; gap: 3px; }
  .finale-stat-num { font-size: 18px; }
  .finale-stat-label { font-size: 10px; }
  .finale-list { max-height: 22vh; margin-bottom: 12px; }
  .finale-row { padding: 6px 10px; font-size: 11px; }
  .finale-hint { font-size: 11px; letter-spacing: 3px; margin-bottom: 8px; }
}
</style>

const game = {

  timerInterval: null,
  progress: {},
  _rafId: null,
  _onPointer: null,
  _lensPos: { x: 0.5, y: 0.5 },
  _hasMoved: false,
  _codeTimer: null,
  _bindTimer: null,
  _transitioning: false,
  _lensScriptPromise: null,

  fmt(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  },

  getXY(evt) {
    return {
      x: evt?.clientX ?? window.innerWidth / 2,
      y: evt?.clientY ?? window.innerHeight / 2
    };
  },

  clearPanels() {
    ['victory', 'finale'].forEach(id => {
      const el = document.getElementById(id);
      el.style.transition = 'none';
      el.classList.remove('show', 'perfect');
      void el.offsetWidth;
      el.style.transition = '';
    });
    document.getElementById('clue-panel').classList.remove('open');
    document.getElementById('panelOverlay').classList.remove('active');
  },

  init() {
    this.loadProgress();
    this.renderMenu();
    this.loadLensScript().then(() => {
      setTimeout(() => this.finishLoading(), 400);
    });
  },

  loadLensScript() {
    if (this._lensScriptPromise) return this._lensScriptPromise;
    this._lensScriptPromise = new Promise((resolve) => {
      if (window.customElements && customElements.get('liquid-lens')) return resolve();

      const s = document.createElement('script');
      s.src = 'https://cdn.mlstziran.de5.net/lg.js';
      s.async = true;
      s.onload = () => {
        if (customElements.get('liquid-lens')) return resolve();
        const t0 = Date.now();
        const poll = () => {
          if (customElements.get('liquid-lens')) return resolve();
          if (Date.now() - t0 > 1500) return resolve();
          setTimeout(poll, 50);
        };
        poll();
      };
      s.onerror = () => {
        console.warn('[lens] CDN 加载失败，进入降级模式');
        resolve();
      };
      document.head.appendChild(s);
    });
    return this._lensScriptPromise;
  },

  finishLoading() {
    const spinner = document.querySelector('.loader-spinner');
    const rect = spinner.getBoundingClientRect();
    const vmaxPx = Math.max(window.innerWidth, window.innerHeight);

    this.playTransition(
      () => document.getElementById('loader').classList.add('hidden'),
      document.getElementById('menu'),
      { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, initialScale: rect.width / vmaxPx }
    );
  },

  loadProgress() {
    const saved = localStorage.getItem('liquidDetective');
    if (saved) {
      try { this.progress = JSON.parse(saved) || {}; }
      catch { this.progress = {}; }
    }
  },

  saveProgress() {
    localStorage.setItem('liquidDetective', JSON.stringify(this.progress));
  },

  resetProgress() {
    if (confirm('确定要重置所有进度吗？')) {
      this.progress = {};
      this.saveProgress();
      this.renderMenu();
    }
  },

  renderMenu() {
    document.getElementById('levelSelect').innerHTML = LEVELS.map((level, idx) => {
      const completed = this.progress[level.id]?.completed;
      const locked = idx > 0 && !this.progress[LEVELS[idx - 1].id]?.completed;
      return `
        <div class="level-card ${completed ? 'completed' : ''} ${locked ? 'locked' : ''}"
             onclick="${locked ? '' : `game.enterLevel(${idx}, event)`}">
          <div class="level-num">${level.id}</div>
          <div class="level-name">${level.name}</div>
        </div>
      `;
    }).join('');
  },

  playTransition(swapFn, targetEl, opts = {}) {
    if (this._transitioning) return Promise.resolve();
    this._transitioning = true;

    const veil = document.getElementById('pageVeil');
    const W = window.innerWidth;
    const H = window.innerHeight;
    const x = opts.x ?? W / 2;
    const y = opts.y ?? H / 2;
    const initialScale = opts.initialScale ?? 0.001;

    const radiusAtScale1 = Math.max(W, H) / 2;
    const maxDist = Math.max(
      Math.hypot(x, y), Math.hypot(W - x, y),
      Math.hypot(x, H - y), Math.hypot(W - x, H - y)
    );
    const targetScale = (maxDist / radiusAtScale1) * 1.05;

    veil.style.transition = 'none';
    veil.classList.remove('active', 'fade');
    veil.style.setProperty('--veil-x', x + 'px');
    veil.style.setProperty('--veil-y', y + 'px');
    veil.style.transform = `translate(-50%, -50%) scale(${initialScale})`;
    veil.style.opacity = '1';
    void veil.offsetWidth;

    if (targetEl) {
      targetEl.style.transition = 'none';
      targetEl.classList.add('blur-in');
      void targetEl.offsetWidth;
      targetEl.style.transition = '';
    }

    veil.style.transition = '';
    veil.classList.add('active');
    void veil.offsetWidth;
    veil.style.transform = `translate(-50%, -50%) scale(${targetScale})`;

    return new Promise((resolve) => {
      setTimeout(() => {
        this.clearPanels();
        try { swapFn(); } catch (e) { console.error(e); }

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            veil.classList.add('fade');
            if (targetEl) targetEl.classList.remove('blur-in');

            setTimeout(() => {
              veil.style.transition = 'none';
              veil.classList.remove('active', 'fade');
              veil.style.transform = 'translate(-50%, -50%) scale(0.001)';
              veil.style.opacity = '1';
              void veil.offsetWidth;
              veil.style.transition = '';
              this._transitioning = false;
              resolve();
            }, 320);
          });
        });
      }, 400);
    });
  },

  navigate(sceneId, swapFn, evt) {
    const { x, y } = this.getXY(evt);
    return this.playTransition(swapFn, document.getElementById(sceneId), { x, y });
  },

  enterLevel(idx, evt) {
    this.navigate('game', () => this.startLevel(idx), evt);
  },

  exitToMenu(evt) {
    this.navigate('menu', () => this.backToMenu(), evt);
  },

  nextLevel(evt) {
    if (this.currentLevel + 1 < LEVELS.length) {
      this.navigate('game', () => this.startLevel(this.currentLevel + 1), evt);
    }
  },

  restartAll(evt) {
    this.navigate('menu', () => {
      this.progress = {};
      this.saveProgress();
      document.getElementById('game').classList.remove('active');
      document.getElementById('menu').classList.remove('hidden');
      this.renderMenu();
    }, evt);
  },

  makeLens(idx) {
    const lens = document.createElement('liquid-lens');
    const attrs = {
      h: '1', fullscreen: '', 'lens-width': '280', 'lens-height': '200',
      'lens-radius': '100', 'bezel-width': '32', 'glass-thickness': '70',
      refraction: '2.6', dispersion: '0.12', 'specular-opacity': '0.95',
      surface: 'convex_squircle', 'render-mode': 'clone', dpr: '2', 'texture-cap': '1024'
    };
    for (const [k, v] of Object.entries(attrs)) {
      if (v === '') lens.setAttribute(k, '');
      else lens.setAttribute(k, v);
    }
    lens.id = 'lens';
    lens.style.setProperty('--bg-primary', 'transparent');
    lens.style.setProperty('--bg-secondary', 'transparent');
    lens.style.setProperty('--grid', 'transparent');
    lens.innerHTML = REAL_SCENES[idx] || REAL_SCENES[0];
    return lens;
  },

  rebuildLens(idx) {
    const oldLens = document.getElementById('lens');
    const newLens = this.makeLens(idx);
    if (oldLens) {
      oldLens.replaceWith(newLens);
    } else {
      const toast = document.getElementById('toast');
      const game = document.getElementById('game');
      game.insertBefore(newLens, toast);
    }
  },

  startLevel(idx) {
    this.currentLevel = idx;
    this.foundClues = [];
    this.startTime = Date.now();
    this._hasMoved = false;

    const level = LEVELS[idx];
    document.getElementById('fakeScene').innerHTML = FAKE_SCENES[idx] || FAKE_SCENES[0];
    this.rebuildLens(idx);
    this.buildCodeInputs();

    const panel = document.getElementById('codeDisplay');
    panel.classList.remove('collapsed', 'shake');
    panel.style.width = '';
    panel.style.height = '';

    document.getElementById('levelDisplay').textContent = `关卡 ${level.id} · ${level.name}`;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('game').classList.add('active');

    this.renderClues();
    this.startTimer();
    this.showToast(level.hint);

    clearTimeout(this._bindTimer);
    this._bindTimer = setTimeout(() => this.bindLensDetection(), 30);
  },

  bindLensDetection() {
    this.stopLensDetection();

    this._lensPos = { x: 0.5, y: 0.5 };
    this._hasMoved = false;

    this._onPointer = (e) => {
      if (e.clientX == null) return;
      this._lensPos.x = e.clientX / window.innerWidth;
      this._lensPos.y = e.clientY / window.innerHeight;
      this._hasMoved = true;
    };
    window.addEventListener('pointermove', this._onPointer, { passive: true });
    window.addEventListener('pointerdown', this._onPointer, { passive: true });

    const check = () => {
      const lens = document.getElementById('lens');
      if (!lens || !document.getElementById('game').classList.contains('active') || !this._hasMoved) {
        this._rafId = requestAnimationFrame(check);
        return;
      }

      const W = window.innerWidth;
      const H = window.innerHeight;
      const lensCx = this._lensPos.x;
      const lensCy = this._lensPos.y;

      lens.querySelectorAll('.clue-area').forEach((area) => {
        const clueId = parseInt(area.dataset.clue, 10);
        if (isNaN(clueId) || this.foundClues.includes(clueId)) return;

        const r = area.getBoundingClientRect();
        if (r.width <= 0) return;

        const PAD = 0.012;
        if (lensCx >= r.left / W - PAD && lensCx <= r.right / W + PAD &&
            lensCy >= r.top / H - PAD && lensCy <= r.bottom / H + PAD) {
          this.foundClue(clueId);
        }
      });

      this._rafId = requestAnimationFrame(check);
    };

    this._rafId = requestAnimationFrame(check);
  },

  stopLensDetection() {
    if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = null; }
    if (this._onPointer) {
      window.removeEventListener('pointermove', this._onPointer);
      window.removeEventListener('pointerdown', this._onPointer);
      this._onPointer = null;
    }
    clearTimeout(this._bindTimer);
  },

  iconSvg(icon) {
    const fillMap = { dotred: 'var(--c-red)', dotgreen: 'var(--c-green)' };
    const isFill = icon in fillMap;
    const style = isFill ? `style="color:${fillMap[icon]}"` : '';
    return `<svg class="clue-svg ${isFill ? 'fill' : ''}" ${style}><use href="#ic-${icon}"/></svg>`;
  },

  foundClue(clueId) {
    if (this.foundClues.includes(clueId)) return;
    this.foundClues.push(clueId);
    const clue = LEVELS[this.currentLevel].clues[clueId];
    this.renderClues();
    this.updateSubmitState();
    this.showToast(`发现线索：${clue.text} [${clue.char}]`);
  },

  renderClues() {
    const level = LEVELS[this.currentLevel];
    document.getElementById('clueList').innerHTML = level.clues.map((clue, idx) => {
      const found = this.foundClues.includes(idx);
      return `
        <div class="clue-slot ${found ? 'found' : ''}">
          <div class="clue-order">${idx + 1}</div>
          <div class="clue-icon">${found ? this.iconSvg(clue.icon) : ''}</div>
          <div class="clue-text">
            ${found
              ? `${clue.text} <b style="color:var(--c-accent);font-size:16px;">${clue.char}</b>`
              : '未发现'}
          </div>
        </div>
      `;
    }).join('');
  },

  toggleClues() {
    const isOpen = document.getElementById('clue-panel').classList.toggle('open');
    document.getElementById('panelOverlay').classList.toggle('active', isOpen);
  },

  buildCodeInputs() {
    const len = LEVELS[this.currentLevel].code.length;
    const container = document.getElementById('codeInputs');
    container.innerHTML = '';

    for (let i = 0; i < len; i++) {
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 1;
      input.className = 'code-char';
      input.dataset.index = i;
      input.autocomplete = 'off';
      input.spellcheck = false;

      input.addEventListener('input', (e) => {
        const v = (e.target.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        e.target.value = v.slice(-1);
        e.target.classList.toggle('filled', !!e.target.value);
        if (e.target.value) {
          const next = container.querySelector(`input[data-index="${i + 1}"]`);
          if (next) next.focus();
        }
        this.updateSubmitState();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value) {
          const prev = container.querySelector(`input[data-index="${i - 1}"]`);
          if (prev) {
            prev.value = '';
            prev.classList.remove('filled');
            prev.focus();
          }
          this.updateSubmitState();
        } else if (e.key === 'Enter') {
          this.checkCode();
        }
      });

      input.addEventListener('focus', (e) => e.target.select());
      container.appendChild(input);
    }

    this.updateSubmitState();
  },

  updateSubmitState() {
    const level = LEVELS[this.currentLevel];
    const inputs = [...document.querySelectorAll('#codeInputs input')];
    const allFilled = inputs.length > 0 && inputs.every((i) => i.value.trim());
    document.getElementById('submitBtn').disabled = !(allFilled && this.foundClues.length >= level.clues.length);
  },

  toggleCodePanel() {
    const panel = document.getElementById('codeDisplay');

    if (!panel.classList.contains('collapsed')) {
      panel.style.width = panel.offsetWidth + 'px';
      panel.style.height = panel.offsetHeight + 'px';
      void panel.offsetWidth;
      panel.classList.add('collapsed');
      panel.style.width = '52px';
      panel.style.height = '52px';
    } else {
      panel.classList.remove('collapsed');
      panel.style.width = 'auto';
      panel.style.height = 'auto';
      const w = panel.offsetWidth;
      const h = panel.offsetHeight;

      panel.classList.add('collapsed');
      panel.style.width = '52px';
      panel.style.height = '52px';
      void panel.offsetWidth;

      panel.classList.remove('collapsed');
      panel.style.width = w + 'px';
      panel.style.height = h + 'px';

      clearTimeout(this._codeTimer);
      this._codeTimer = setTimeout(() => {
        if (!panel.classList.contains('collapsed')) {
          panel.style.width = '';
          panel.style.height = '';
        }
      }, 400);
    }
  },

  checkCode() {
    const level = LEVELS[this.currentLevel];
    const inputs = [...document.querySelectorAll('#codeInputs input')];
    const inputCode = inputs.map((i) => i.value.trim().toUpperCase()).join('');

    if (inputCode === level.code.toUpperCase()) {
      this.completeLevel();
      return;
    }

    this.showToast('密码错误，请按线索面板的编号顺序输入', true);

    const panel = document.getElementById('codeDisplay');
    panel.classList.remove('shake');
    void panel.offsetWidth;
    panel.classList.add('shake');
    setTimeout(() => panel.classList.remove('shake'), 450);

    inputs.forEach((i) => { i.value = ''; i.classList.remove('filled'); });
    inputs[0]?.focus();
    this.updateSubmitState();
  },

  startTimer() {
    clearInterval(this.timerInterval);
    document.getElementById('timer').textContent = '00:00';
    this.timerInterval = setInterval(() => {
      document.getElementById('timer').textContent = this.fmt(Math.floor((Date.now() - this.startTime) / 1000));
    }, 1000);
  },

  completeLevel() {
    clearInterval(this.timerInterval);
    this.stopLensDetection();

    const level = LEVELS[this.currentLevel];
    const elapsed = Math.floor((Date.now() - this.startTime) / 1000);

    this.progress[level.id] = { completed: true, time: elapsed, cluesFound: this.foundClues.length };
    this.saveProgress();

    if (this.currentLevel + 1 >= LEVELS.length) {
      this.showFinale();
      return;
    }

    document.getElementById('victoryStats').innerHTML = `
      关卡：${level.name}<br>
      用时：${this.fmt(elapsed)}<br>
      线索：${this.foundClues.length}/${level.clues.length}
    `;
    const v = document.getElementById('victory');
    v.classList.remove('show');
    void v.offsetWidth;
    requestAnimationFrame(() => v.classList.add('show'));
  },

  showFinale() {
    let totalTime = 0, totalClues = 0, totalPossible = 0;

    const rows = LEVELS.map((level, i) => {
      const p = this.progress[level.id] || { time: 0, cluesFound: 0 };
      totalTime += p.time || 0;
      totalClues += p.cluesFound || 0;
      totalPossible += level.clues.length;

      const perfect = p.cluesFound >= level.clues.length;
      const pct = Math.round((p.cluesFound / level.clues.length) * 100);

      return `
        <div class="finale-row" style="--i:${i}">
          <span class="row-name">${level.id}. ${level.name}</span>
          <span class="mini-bar"><span class="mini-fill ${perfect ? 'perfect' : ''}" style="--pct:${pct}%"></span></span>
          <span class="row-meta">
            <span class="row-time">${this.fmt(p.time || 0)}</span>
            <span class="row-clues ${perfect ? 'perfect' : ''}">${p.cluesFound}/${level.clues.length}</span>
          </span>
        </div>
      `;
    }).join('');

    document.getElementById('finaleSummary').innerHTML = `
      <div class="finale-stat" style="--i:0">
        <div class="finale-stat-num" data-target="${LEVELS.length}">0</div>
        <div class="finale-stat-label">关卡</div>
      </div>
      <div class="finale-stat" style="--i:1">
        <div class="finale-stat-num" data-target="${totalTime}" data-format="time">00:00</div>
        <div class="finale-stat-label">总用时</div>
      </div>
      <div class="finale-stat" style="--i:2">
        <div class="finale-stat-num" data-target="${totalClues}" data-max="${totalPossible}">0/${totalPossible}</div>
        <div class="finale-stat-label">线索</div>
      </div>
    `;
    document.getElementById('finaleList').innerHTML = rows;

    const isPerfect = totalClues >= totalPossible;
    const subtitle = document.getElementById('finaleSubtitle');
    subtitle.textContent = isPerfect ? 'PERFECT · 完美通关' : 'CASE CLOSED · ALL CLEARED';
    subtitle.classList.toggle('perfect', isPerfect);

    const finale = document.getElementById('finale');
    finale.classList.toggle('perfect', isPerfect);
    finale.classList.remove('show');
    void finale.offsetWidth;
    requestAnimationFrame(() => {
      finale.classList.add('show');
      setTimeout(() => {
        document.querySelectorAll('.finale-stat-num').forEach((el) => {
          this.animateNumber(el, +el.dataset.target, 900, el.dataset.format, el.dataset.max);
        });
      }, 760);
    });
  },

  animateNumber(el, target, duration, format, max) {
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const val = Math.round(target * (1 - Math.pow(1 - t, 3)));
      if (format === 'time') el.textContent = this.fmt(val);
      else if (max) el.textContent = `${val}/${max}`;
      else el.textContent = String(val);
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },

  backToMenu() {
    clearInterval(this.timerInterval);
    this.stopLensDetection();
    document.getElementById('game').classList.remove('active');
    document.getElementById('menu').classList.remove('hidden');
    this.renderMenu();
  },

  showToast(msg, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }
};

window.addEventListener('DOMContentLoaded', () => game.init());
</script>
</body>
